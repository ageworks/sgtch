<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f7a4f">
<meta name="description" content="つくばユナイテッドSun GAIA 育成ゲーム さんがいあっち（HTML単体版）">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>さんがいあっち｜TSUKUBA UNITED Sun GAIA</title>
<style>
:root{
  --ink:#16241c;
  --shell:#0f7a4f; --shell-d:#0a5836; --shell-l:#17a068;
  --sun:#ffd23f; --sun-d:#dda600;
  --berry:#d3405e; --sky:#2f7fd1;
  --paper:#eaefe6; --card:#fffdf6; --line:#cdd6c6; --muted:#5f6d5c;
  --r:16px;
  --f:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","M PLUS Rounded 1c","Rounded Mplus 1c","Yu Gothic",YuGothic,"Meiryo",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--f); font-size:19px; line-height:1.5; color:var(--ink);
  background:var(--shell-d);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 48px),
                   repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 48px);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;
}
/* 画面は 9:16 の縦長。はみ出さないよう、中身の高さで組む */
#app{position:relative;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
  width:min(100vw,calc(100dvh * 9 / 16));
  height:min(100dvh,calc(100vw * 16 / 9));
  max-width:520px;max-height:940px}
@media (max-width:560px){
  #app{width:100vw;height:100dvh;max-width:none;max-height:none}
}
@media (min-width:561px){
  body{align-items:center;padding:16px 0}
  #app{border-radius:30px;box-shadow:0 0 0 10px var(--shell),0 0 0 12px var(--shell-d),0 26px 60px rgba(0,0,0,.45)}
}
/* ===== ヘッダー ===== */
#topbar{flex:0 0 auto;background:var(--shell);color:#fff;position:relative;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:baseline;gap:10px}
.tb-date{font-family:var(--f-mono);font-size:17px;letter-spacing:.06em;opacity:.9}
.tb-time{font-family:var(--f-mono);font-size:26px;font-weight:700;letter-spacing:.05em;line-height:1.1}
.tb-dow{font-family:var(--f-mono);font-size:15px;opacity:.85}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:7px}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.22)}
#prog i{display:block;height:100%;background:var(--sun);transition:width .6s}
/* ===== スクロール域 ===== */
#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 12px;
  display:flex;flex-direction:column;min-height:0}
.scr{animation:fade .2s ease;display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
.scr.scrollable{overflow-y:auto;-webkit-overflow-scrolling:touch}
.spacer{flex:1 1 auto;min-height:0}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h2.hd{font-size:23px;font-weight:700;margin:0;letter-spacing:.04em;display:flex;align-items:center;gap:9px;flex:0 0 auto}
/* アイコンは既定で 1em 相当。個別指定がなければ文字と同じ大きさで並ぶ */
img.ic{width:1.15em;height:1.15em;flex:0 0 auto;image-rendering:pixelated;display:block;object-fit:contain}
h2.hd img.ic{width:26px;height:26px}
/* ===== ステージ（HD-2D風の背景＋ドット絵） ===== */
.stage{position:relative;border-radius:var(--r);overflow:hidden;flex:1 1 auto;
  min-height:min(150px,20vh);max-height:44vh;
  background-size:cover;background-position:center bottom;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 4px 14px rgba(20,40,25,.22)}
.stage.tall{max-height:52vh}
.stage.fix{flex:0 0 auto;height:180px}
.stage .sprite{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
  width:min(150px,26vh);height:auto;aspect-ratio:22/24;animation:bob 2.8s ease-in-out infinite;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));z-index:2}
.stage.tall .sprite{width:min(186px,32vh)}
.stage .shadow{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);
  width:min(104px,18vh);height:18px;border-radius:50%;background:rgba(40,20,0,.3);filter:blur(4px);z-index:1}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
.stage .nameplate{position:absolute;top:10px;left:10px;z-index:3;background:rgba(12,40,26,.72);
  color:#fff;font-weight:700;font-size:17px;padding:4px 13px;border-radius:999px;letter-spacing:.05em}
.stage .say{position:absolute;left:0;right:0;bottom:0;z-index:3;
  background:rgba(255,253,246,.94);padding:10px 14px;
  font-size:18px;font-weight:700;text-align:center;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
/* ===== 状態表示（数字なし） ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;flex:0 0 auto}
.st{display:flex;align-items:center;gap:8px;font-size:16px}
.st .lb{width:66px;flex:0 0 auto;color:var(--muted);font-size:16px}
.dots{display:flex;gap:4px}
.dots i{width:13px;height:13px;border-radius:4px;background:#d5ddd0;display:block}
.dots i.on{background:var(--shell)}
.dots i.low{background:var(--berry)}
.dots i.warm{background:var(--sun-d)}
/* ===== パネル・ボタン ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;flex:0 0 auto}
.panel h3{font-size:19px;margin:0 0 10px;letter-spacing:.03em}
.rowlab{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.rowlab b{font-size:19px}
.rowlab span{font-size:16px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:min(62px,8.6vh);padding:9px 13px;border-radius:13px;cursor:pointer;
  background:var(--card);border:2px solid var(--line);color:var(--ink);
  font-family:var(--f);font-weight:700;font-size:21px;letter-spacing:.04em;
  box-shadow:0 3px 0 var(--line);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--shell);border-color:var(--shell-d);color:#fff;box-shadow:0 4px 0 var(--shell-d)}
.btn.sun{background:var(--sun);border-color:var(--sun-d);color:#3a2c00;box-shadow:0 4px 0 var(--sun-d)}
.btn.pri:active,.btn.sun:active{box-shadow:none}
.btn.sm{min-height:min(54px,7.6vh);font-size:19px}
.btn.dim{opacity:.36;pointer-events:none}
.btn.warnb{border-color:var(--berry);color:var(--berry);box-shadow:0 3px 0 #edb9c5}
.btn .ic{width:28px;height:28px}
.btn.sm .ic{width:25px;height:25px}
.btn .cnt{margin-left:auto;font-size:16px;font-weight:400;opacity:.8}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* おせわ：ラベルの下にそのステータスを出して、対応を見せる */
.carebtn{display:flex;align-items:center;gap:11px;width:100%;min-height:min(70px,9.4vh);padding:8px 13px;
  border-radius:13px;cursor:pointer;background:var(--card);border:2px solid var(--line);color:var(--ink);
  font-family:var(--f);box-shadow:0 3px 0 var(--line);transition:transform .07s,box-shadow .07s;text-align:left}
.carebtn:active{transform:translateY(3px);box-shadow:none}
.carebtn img{width:30px;height:30px;flex:0 0 auto;image-rendering:pixelated}
.carebtn .cb-t{font-weight:700;font-size:21px;letter-spacing:.04em;line-height:1.15}
.carebtn .cb-s{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:14px;color:var(--muted)}
.carebtn .cb-r{margin-left:auto;font-size:15px;font-weight:700;color:var(--muted)}
.carebtn.need{background:var(--shell);border-color:var(--shell-d);color:#fff;box-shadow:0 4px 0 var(--shell-d)}
.carebtn.need .cb-s,.carebtn.need .cb-r{color:rgba(255,255,255,.85)}
.carebtn.need .dots i{background:rgba(255,255,255,.28)}
.carebtn.need .dots i.on{background:#fff}
.carebtn.need .dots i.low{background:var(--sun)}
.carebtn.need .dots i.warm{background:var(--sun)}
.carebtn.done .cb-r{color:var(--shell)}
/* ホーム：4つを おなじ形・おなじ文字サイズに そろえる */
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
.homebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  width:100%;min-height:min(88px,12vh);padding:8px 6px;border-radius:13px;cursor:pointer;
  background:var(--card);border:2px solid var(--line);color:var(--ink);font-family:var(--f);
  box-shadow:0 3px 0 var(--line);transition:transform .07s,box-shadow .07s}
.homebtn:active{transform:translateY(3px);box-shadow:none}
.homebtn .hb-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;
  letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.homebtn .hb-t img{width:25px;height:25px;flex:0 0 auto;image-rendering:pixelated}
.homebtn .hb-s{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
  white-space:nowrap;line-height:1.1}
.homebtn.pri{background:var(--shell);border-color:var(--shell-d);color:#fff;box-shadow:0 4px 0 var(--shell-d)}
.homebtn.sun{background:var(--sun);border-color:var(--sun-d);color:#3a2c00;box-shadow:0 4px 0 var(--sun-d)}
.homebtn.pri:active,.homebtn.sun:active{box-shadow:none}
.homebtn.pri .hb-s{color:rgba(255,255,255,.85)}
.homebtn.sun .hb-s{color:#6b5200}
.homebtn.pri .dots i{background:rgba(255,255,255,.3)}
.homebtn.pri .dots i.on{background:#fff}
.homebtn.pri .dots i.low{background:var(--sun)}
.homebtn.pri .dots i.warm{background:var(--sun)}
.homebtn.sun .dots i{background:rgba(0,0,0,.16)}
.homebtn.sun .dots i.on{background:#5a4400}
/* 回復までの時間 */
.rechg{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);white-space:nowrap}
/* キャラ切り替えタブ（横スライド） */
.chartabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px;flex:0 0 auto;
  scroll-snap-type:x proximity}
.chartabs button{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  width:72px;padding:5px 3px;border-radius:12px;border:2px solid var(--line);cursor:pointer;
  background:linear-gradient(180deg,#f4f8ef,#dfe8d8);font-family:var(--f);font-size:12px;font-weight:700;color:var(--muted)}
.chartabs button img{width:38px;height:41px;object-fit:contain;image-rendering:pixelated}
.chartabs button.on{border-color:var(--shell);background:var(--shell);color:#fff;box-shadow:0 2px 0 var(--shell-d)}
.chartabs .cnum{font-family:var(--f-mono);font-size:11px;opacity:.85}
.stack{display:grid;gap:10px}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:700;background:var(--shell);color:#fff}
.pill.g{background:#dfe9d8;color:var(--shell-d)}
.pill.s{background:var(--sun);color:#3a2c00}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:17px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.ab{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;padding:5px 0;font-size:16px}
/* ===== ナビ ===== */
#nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--shell);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
#nav button{position:relative;background:transparent;border:0;color:rgba(255,255,255,.75);
  font-family:var(--f);font-weight:700;font-size:13px;padding:6px 2px;border-radius:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center}
#nav button img{width:26px;height:26px;image-rendering:pixelated;display:block}
#nav button.on img{filter:drop-shadow(0 0 6px rgba(255,210,63,.9))}
#nav button.on{color:#fff;background:rgba(0,0,0,.22)}
#nav button .dot{position:absolute;top:5px;right:calc(50% - 22px);width:9px;height:9px;
  border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--shell)}
/* ===== 図鑑・スタンプ ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scrollpanel{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.grid2s{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.cell{border-radius:12px;padding:6px;text-align:center;cursor:pointer;border:1px solid var(--line);
  background:linear-gradient(180deg,#f4f8ef,#dfe8d8)}
.cell img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.cell .cn{font-size:15px;font-weight:700;margin-top:2px}
.cell.lock{background:#dfe4da;border-style:dashed}
.cell.lock .qm{display:grid;place-items:center;aspect-ratio:1;font-size:34px;color:#a8b3a4;font-weight:700}
.cell.lock .cn{color:#a8b3a4}
/* ===== 思い出カード ===== */
.mcard{cursor:pointer;background:linear-gradient(160deg,#fffdf2,#e6efdf);border:2px solid var(--shell);
  border-radius:16px;padding:12px;position:relative;overflow:hidden;box-shadow:0 3px 0 var(--shell-d);flex:0 0 auto}
.mcard::before{content:"";position:absolute;inset:auto -32px -44px auto;width:160px;height:160px;
  border-radius:50%;background:rgba(255,210,63,.32)}
.mcard .mc-h{display:flex;gap:12px;align-items:center;position:relative}
.mcard img{width:84px;height:92px;flex:0 0 auto;object-fit:contain}
.mcard .mc-n{font-weight:700;font-size:19px;line-height:1.3}
.mcard .mc-g{font-size:14px;color:var(--muted)}
.mcard .mc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;position:relative}
/* ===== モーダル・トースト ===== */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(10,25,15,.55)}
#modal.on{display:flex}
.sheet{width:100%;max-width:430px;background:var(--paper);border-radius:20px 20px 0 0;
  padding:18px 14px calc(env(safe-area-inset-bottom) + 18px);max-height:88dvh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:22px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:100%;max-width:400px;padding:0 16px}
.toast{background:var(--ink);color:#fff;font-size:17px;font-weight:700;padding:11px 18px;border-radius:999px;
  box-shadow:0 6px 18px rgba(0,0,0,.3);animation:tin .22s ease;text-align:center}
.toast.good{background:var(--shell)} .toast.bad{background:var(--berry)} .toast.gold{background:var(--sun);color:#3a2c00}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ===== しあい ===== */
.hgauge{position:relative;height:62px;background:#dde4d8;border-radius:13px;overflow:hidden;border:2px solid var(--line)}
.hgauge .zone{position:absolute;top:0;bottom:0;background:rgba(23,160,104,.34)}
.hgauge .zone.core{background:rgba(255,210,63,.85)}
.hgauge .ball{position:absolute;top:9px;width:42px;height:42px;margin-left:-21px;left:0}
.vgauge{position:relative;height:min(236px,30vh);width:110px;margin:0 auto;background:#dde4d8;
  border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.vgauge .zone{position:absolute;left:0;right:0;background:rgba(23,160,104,.34)}
.vgauge .zone.core{background:rgba(255,210,63,.85)}
.vgauge .ball{position:absolute;left:50%;width:46px;height:46px;margin-left:-23px;bottom:0}
.vgauge .netline{position:absolute;left:0;right:0;height:3px;background:rgba(20,40,25,.35)}
.mgcount{display:flex;justify-content:center;gap:9px;margin-bottom:11px}
.mgcount i{width:15px;height:15px;border-radius:50%;background:#d5ddd0;display:block}
.mgcount i.ok{background:var(--shell)} .mgcount i.great{background:var(--sun)} .mgcount i.ng{background:var(--berry)}
.mgmsg{text-align:center;font-size:20px;font-weight:700;min-height:32px;margin-top:12px}
.lanes{position:relative;height:min(280px,38vh);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#22352b,#132018);border:2px solid var(--line)}
.lanes .lane{position:absolute;top:0;bottom:0;width:33.333%;border-right:1px dashed rgba(255,255,255,.14)}
.lanes .lane:last-child{border-right:0}
.lanes .lane.f{background:rgba(255,255,255,.14)}
.lanes .judge{position:absolute;left:0;right:0;bottom:56px;height:5px;background:var(--sun);box-shadow:0 0 18px rgba(255,210,63,.85)}
.lanes .lname{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.62);font-size:14px;font-weight:700}
.note{position:absolute;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(180deg,#8ff0c2,#17a068);border:2px solid #0a5836;
  color:#052b1b;font-weight:700;font-size:15px;will-change:transform}
.note.hit{background:linear-gradient(180deg,#fff0b8,#ffd23f);border-color:#a87c00}
.note.miss{opacity:.25}
.lanebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}
.lanebtns .btn{min-height:min(78px,11vh);font-size:22px;flex-direction:column;gap:2px}
.lanebtns .btn small{font-size:13px;font-weight:400;opacity:.7}
.bighit{min-height:min(104px,13vh);font-size:26px}
.gradebig{font-size:34px;font-weight:700;text-align:center;letter-spacing:.1em;margin:2px 0 4px}
/* ===== 写真編集 ===== */
.pstage{position:relative;width:100%;background:#20291f;border-radius:var(--r);overflow:hidden;touch-action:none;flex:0 0 auto}
.pstage canvas{display:block;width:100%;height:auto;touch-action:none}
.ptools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}
.ptools .btn{min-height:54px;font-size:21px;padding:4px}
.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.picker button{flex:0 0 auto;width:70px;height:70px;border-radius:12px;border:2px solid var(--line);
  background:linear-gradient(180deg,#f4f8ef,#dfe8d8);padding:3px;cursor:pointer}
.picker img{width:100%;height:100%;object-fit:contain}
/* ===== MEGA NeXT ロゴ ===== */
.mnx{position:absolute;top:6px;right:6px;z-index:5;border:0;cursor:pointer;
  background:linear-gradient(160deg,#25384a,#0c141c);color:#cfe6ff;
  padding:8px 13px;border-radius:10px;font-family:var(--f-mono);font-size:12px;font-weight:700;
  letter-spacing:.14em;box-shadow:0 3px 0 #060b10,inset 0 1px 0 rgba(255,255,255,.2)}
.mnx b{color:var(--sun)}
.mnx:active{transform:translateY(2px);box-shadow:0 1px 0 #060b10}
.devbar{background:#101a22;color:#8fd0ff;font-family:var(--f-mono);font-size:12px;
  padding:9px 13px;border-radius:10px;letter-spacing:.1em}
.slider{display:grid;grid-template-columns:82px 1fr 40px;align-items:center;gap:10px;font-size:16px;padding:5px 0}
.slider input{width:100%;accent-color:var(--shell)}
.slider .v{font-family:var(--f-mono);font-size:14px;text-align:right;color:var(--muted)}
select{width:100%;font-family:var(--f);font-size:18px;padding:12px;border-radius:11px;
  border:2px solid var(--line);background:var(--card);color:var(--ink)}
/* ===== 演出 ===== */
.reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}60%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1);opacity:1}}
.shk{animation:shk .13s steps(2) infinite}
@keyframes shk{0%{transform:translateX(-50%) translateY(0) rotate(-4deg)}100%{transform:translateX(-50%) translateY(-8px) rotate(4deg)}}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
  border-bottom:1px dashed var(--line);font-size:19px}
label.sw:last-of-type{border-bottom:0}
label.sw input{width:24px;height:24px;accent-color:var(--shell)}

<script>
/* =========================================================================
   さんがいあっち / HTML単体版   TSUKUBA UNITED Sun GAIA
   キャラクター＝ドット絵スプライト（透過）／背景＝高解像度のきれいな絵
   画像差し替えは ASSET_MANIFEST の値を置き換えるだけ。
   ========================================================================= */
'use strict';

/* ============================== 1. CONFIG ============================== */
const CONFIG = {
  schemaVersion: 4,
  saveKey: 'sangaiatch_save_v3',
  backupKey: 'sangaiatch_save_v3_prev',
  hour: 3600 * 1000,
  day: 24 * 3600 * 1000,
  stageDays: { ball: 1, posi: 2, player: 4 },
  dailyLimits: { treat: 1 },
  /* おせわの欲求：1時間あたりの減り方。段階ごとにちがう。
     ぼーるっちは全体的に早く、せんしゅっちは おなか だけ早い。 */
  needRates: {
    ball: { food: 40, hp: 30, clean: 26, mood: 34 },
    posi: { food: 24, hp: 16, clean: 13, mood: 18 },
    player: { food: 26, hp: 9, clean: 7, mood: 10 },
    retired: { food: 5, hp: 3, clean: 3, mood: 4 }
  },
  needAsk: 25,      // これを下回ると「お世話して」と言う
  needFull: 60,     // これ以上なら満たされている
  fatigueDownPerHour: 8,
  /* 放置したときの影響 */
  neglect: { growthPer: 0.12, growthMin: 0.55, abilityPerHour: 0.3, moodExtra: 0.3 },
  posiTemperature: 17,
  playerTemperature: 24,
  gaiaBase: 0.02, gaiaMax: 0.08,
  albumMax: 12, thumbSize: 132
};
/* れんしゅう・しあいの回復（◯時間に1回・最大3ストック） */
CONFIG.chargeSpec = {
  train: { every: 3 * CONFIG.hour, max: 3 },
  match: { every: 4 * CONFIG.hour, max: 3 }
};
const STAGE_MS = {
  ball: CONFIG.stageDays.ball * CONFIG.day,
  posi: CONFIG.stageDays.posi * CONFIG.day,
  player: CONFIG.stageDays.player * CONFIG.day
};

/* ============================ ユーティリティ ============================ */
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const pad2 = n => n < 10 ? '0' + n : '' + n;
function fmtDate(ms) { const d = new Date(ms); return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()); }
function fmtDateTime(ms) { const d = new Date(ms); return fmtDate(ms) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function seededRandom(seed) {
  let t = (seed += 0x6D2B79F5);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function makeRng(seed) { let s = seed >>> 0; return () => { s = (s + 0x9E3779B9) >>> 0; return seededRandom(s); }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function svgUri(inner, w, h, scale) {
  const s = scale || 16;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h +
    '" width="' + (w * s) + '" height="' + (h * s) + '" shape-rendering="crispEdges">' + inner + '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ======================= 2. ドット絵スプライト生成 ======================= */
function Grid(w, h) { this.w = w; this.h = h; this.c = new Array(w * h).fill(null); }
Grid.prototype.set = function (x, y, col) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h || !col) return; this.c[y * this.w + x] = col; };
Grid.prototype.get = function (x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null; return this.c[y * this.w + x]; };
Grid.prototype.rect = function (x, y, w, h, col) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, col); };
Grid.prototype.over = function (x, y, col) { if (this.get(Math.round(x), Math.round(y))) this.set(x, y, col); };
Grid.prototype.outline = function (col) {
  const out = [];
  for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
    if (this.get(x, y)) continue;
    if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) out.push([x, y]);
  }
  out.forEach(p => this.set(p[0], p[1], col));
};
Grid.prototype.blit = function (g, ox, oy) {
  for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) { const c = g.get(x, y); if (c) this.set(x + ox, y + oy, c); }
};
Grid.prototype.paths = function () {
  const byCol = {};
  for (let y = 0; y < this.h; y++) {
    let x = 0;
    while (x < this.w) {
      const c = this.get(x, y);
      if (!c) { x++; continue; }
      let w = 1;
      while (x + w < this.w && this.get(x + w, y) === c) w++;
      (byCol[c] = byCol[c] || []).push('M' + x + ' ' + y + 'h' + w + 'v1h-' + w + 'z');
      x += w;
    }
  }
  return Object.keys(byCol).map(c => '<path fill="' + c + '" d="' + byCol[c].join('') + '"/>').join('');
};

const SPR_W = 22, SPR_H = 24, DARK = '#241a14';

/* キャラクター1体分のドット絵グリッドを作る */
function creatureGrid(o) {
  const g = new Grid(SPR_W, SPR_H);
  const main = o.main, shade = o.shade, accent = o.accent || '#ffd23f';
  const pose = o.pose || 'stand', face = o.face || 'idle';
  const dy = pose === 'jump' ? -2 : (pose === 'down' ? 1 : 0);
  const cx = 10.5, cy = 13.5 + dy;
  const rx = o.rx || 8.2, ry = (o.ry || 7.2) * (pose === 'down' ? 0.92 : 1);
  const top = Math.round(cy - ry), bot = Math.round(cy + ry);
  const icx = Math.round(cx - 0.5);

  /* 体 */
  for (let y = 0; y < SPR_H; y++) for (let x = 0; x < SPR_W; x++) {
    const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
    if (nx * nx + ny * ny <= 1) g.set(x, y, (nx + ny > 0.62) ? shade : main);
  }
  /* 腕（体の上に描いて外へ出す） */
  const lx = Math.round(cx - rx), rxx = Math.round(cx + rx) - 2;
  if (pose === 'cheer' || pose === 'jump') {
    g.rect(lx - 1, Math.round(cy) - 3, 2, 3, main); g.rect(lx - 2, Math.round(cy) - 6, 2, 3, main);
    g.rect(rxx + 1, Math.round(cy) - 3, 2, 3, main); g.rect(rxx + 2, Math.round(cy) - 6, 2, 3, main);
  } else {
    g.rect(lx - 1, Math.round(cy) + 1, 2, 4, main); g.rect(rxx + 1, Math.round(cy) + 1, 2, 4, main);
  }
  /* 足 */
  if (pose === 'jump') { g.rect(icx - 4, bot - 1, 3, 2, shade); g.rect(icx + 2, bot - 1, 3, 2, shade); }
  else { g.rect(icx - 5, bot - 1, 3, 3, shade); g.rect(icx + 3, bot - 1, 3, 3, shade); }
  /* ハイライト */
  g.over(icx - 5, top + 2, '#ffffff'); g.over(icx - 4, top + 2, '#ffffff'); g.over(icx - 5, top + 3, '#ffffff');
  /* ボールの縫い目 / ユニフォームの帯 */
  if (o.jersey) {
    for (let x = 0; x < SPR_W; x++) { g.over(x, bot - 4, accent); g.over(x, bot - 3, accent); }
    g.over(icx, bot - 5, accent); g.over(icx + 1, bot - 5, accent);
  } else {
    for (let x = icx - 6; x <= icx + 6; x++) {
      const yy = Math.round(bot - 3 - Math.cos((x - icx) / 7 * 1.4) * 1.6);
      g.over(x, yy, shade);
    }
  }
  /* 頭の飾り（ポジションの識別） */
  drawCrest(g, o.crest, icx, top, accent);
  /* 表情 */
  drawFace(g, face, icx, Math.round(cy));
  g.outline(DARK);
  return g;
}
function drawCrest(g, kind, cx, top, accent) {
  switch (kind) {
    case 'spike':
      g.rect(cx, top - 4, 1, 1, accent); g.rect(cx - 1, top - 3, 3, 1, accent); g.rect(cx - 2, top - 2, 5, 1, accent);
      break;
    case 'wing':
      g.rect(cx - 10, top + 1, 3, 2, accent); g.rect(cx - 11, top + 2, 2, 2, accent);
      g.rect(cx + 8, top + 1, 3, 2, accent); g.rect(cx + 10, top + 2, 2, 2, accent);
      break;
    case 'star':
      g.rect(cx, top - 5, 1, 4, accent); g.rect(cx - 2, top - 3, 5, 1, accent);
      g.rect(cx - 1, top - 4, 3, 1, accent); g.rect(cx - 1, top - 2, 3, 1, accent);
      break;
    case 'ant':
      g.rect(cx - 4, top - 3, 1, 3, accent); g.rect(cx - 5, top - 5, 2, 2, accent);
      g.rect(cx + 4, top - 3, 1, 3, accent); g.rect(cx + 4, top - 5, 2, 2, accent);
      break;
    case 'knee':
      for (let x = 0; x < SPR_W; x++) { g.over(x, top + 2, accent); g.over(x, top + 3, accent); }
      break;
    case 'band':
      for (let x = 0; x < SPR_W; x++) { g.over(x, top + 1, accent); g.over(x, top + 2, accent); }
      g.rect(cx - 1, top - 2, 3, 2, accent); g.rect(cx, top - 3, 1, 1, accent);
      break;
  }
}
function drawFace(g, face, cx, cy) {
  const ey = cy - 3, my = cy + 2, L = cx - 4, R = cx + 2, PINK = '#e0607a';
  const openEye = x => { g.rect(x, ey, 2, 3, DARK); g.set(x, ey, '#ffffff'); };
  const smileEye = x => { g.set(x, ey + 1, DARK); g.set(x + 1, ey, DARK); g.set(x + 2, ey + 1, DARK); };
  const shutEye = x => { g.rect(x, ey + 1, 3, 1, DARK); };
  if (face === 'happy' || face === 'win') { smileEye(L - 1); smileEye(R); }
  else if (face === 'sleep') { shutEye(L - 1); shutEye(R); }
  else if (face === 'surprise') { g.rect(L - 1, ey - 1, 3, 4, DARK); g.set(L, ey, '#ffffff'); g.rect(R, ey - 1, 3, 4, DARK); g.set(R + 1, ey, '#ffffff'); }
  else { openEye(L); openEye(R); }
  if (face === 'angry') { g.rect(L - 1, ey - 2, 3, 1, DARK); g.rect(R + 1, ey - 2, 3, 1, DARK); }
  if (face === 'sad') { g.rect(L, ey + 3, 1, 3, '#5fb0e8'); }
  if (face === 'sleep') { g.rect(cx + 7, cy - 7, 2, 1, '#ffffff'); g.rect(cx + 8, cy - 6, 1, 1, '#ffffff'); g.rect(cx + 7, cy - 5, 2, 1, '#ffffff'); }
  switch (face) {
    case 'happy': g.rect(cx - 2, my, 4, 2, DARK); g.rect(cx - 1, my + 1, 2, 1, PINK); break;
    case 'win': g.rect(cx - 3, my - 1, 6, 3, DARK); g.rect(cx - 2, my + 1, 4, 1, PINK); break;
    case 'sad': g.set(cx - 2, my + 1, DARK); g.rect(cx - 1, my, 2, 1, DARK); g.set(cx + 1, my + 1, DARK); break;
    case 'angry': g.rect(cx - 2, my, 5, 1, DARK); break;
    case 'sleep': g.rect(cx - 1, my, 2, 1, DARK); break;
    case 'surprise': g.rect(cx - 1, my, 2, 2, DARK); break;
    default: g.rect(cx - 1, my, 2, 1, DARK);
  }
}
/* キャラクター画像（透過） */
function makeSprite(o) {
  return svgUri(creatureGrid(o).paths(), SPR_W, SPR_H, 18);
}
/* スタンプ画像（透過・表情／ポーズ／横長だ円の吹き出しで表現） */
function makeStamp(o) {
  const W = 43, H = 32, g = new Grid(W, H);
  /* 横長のだ円 */
  const bcx = 28, bcy = 7, brx = 14, bry = 6.8;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const nx = (x + 0.5 - bcx) / brx, ny = (y + 0.5 - bcy) / bry;
    if (nx * nx + ny * ny <= 1) g.set(x, y, '#ffffff');
  }
  g.outline(DARK);
  /* キャラは だ円のあとに 重ねる */
  g.blit(creatureGrid(o), 0, 8);
  /* しっぽは いちばん上に 描いて 隠れないようにする */
  [[19, 14, 3, 2], [17, 17, 2, 2]].forEach(t => {
    for (let j = -1; j <= t[3]; j++) for (let i = -1; i <= t[2]; i++) {
      const x = t[0] + i, y = t[1] + j;
      const inside = i >= 0 && j >= 0 && i < t[2] && j < t[3];
      if (inside) g.set(x, y, '#ffffff');
      else if (!g.get(x, y)) g.set(x, y, DARK);
    }
  });
  const t = String(o.bubble || '');
  const fs = t.length <= 3 ? 5.8 : (t.length <= 4 ? 4.9 : (t.length <= 5 ? 4.2 : 3.6));
  const txt = '<text x="' + bcx + '" y="' + (bcy + fs * 0.36) + '" font-size="' + fs +
    '" font-weight="bold" text-anchor="middle" fill="#241a14" font-family="sans-serif" shape-rendering="auto">' + esc(t) + '</text>';
  return svgUri(g.paths() + txt, W, H, 15);
}

  const inner =
    '<defs>' +

    '<linearGradient id="bm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6da" stop-opacity=".55"/><stop offset="1" stop-color="#fff6da" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="wn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e2"/><stop offset="1" stop-color="' + (warm ? '#ffbe7a' : '#cdeaf2') + '"/></linearGradient>' +
    '<radialGradient id="vg" cx=".5" cy=".46" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>' +
    '<radialGradient id="gl" cx=".5" cy=".2" r=".6"><stop offset="0" stop-color="#fff3cf" stop-opacity=".5"/><stop offset="1" stop-color="#fff3cf" stop-opacity="0"/></radialGradient>' +
    '</defs>' +
    '<rect width="480" height="330" fill="url(#sk)"/>' + windows + beams +
    '<rect y="150" width="480" height="42" fill="rgba(20,50,60,.25)"/>' +
    '<rect x="34" y="118" width="412" height="74" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2"/>' +
    '<rect x="34" y="118" width="412" height="74" fill="rgba(255,255,255,.06)"/>' +
    '<line x1="34" y1="118" x2="34" y2="196" stroke="#f2f6f8" stroke-width="4"/>' +
    '<line x1="446" y1="118" x2="446" y2="196" stroke="#f2f6f8" stroke-width="4"/>' +
    '<rect y="192" width="480" height="138" fill="url(#fl)"/>' + boards + rows +
    '<path d="M104 330 L206 196 L274 196 L376 330 Z" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="3"/>' +
    '<line x1="150" y1="262" x2="330" y2="262" stroke="rgba(255,255,255,.6)" stroke-width="2.5"/>' +
    dust + '<rect width="480" height="330" fill="url(#gl)"/><rect width="480" height="330" fill="url(#vg)"/>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="960" height="660">' + inner + '</svg>');
}

/* ======================= 4. ASSET_MANIFEST ======================= */
/* ======================= UIアイコン（ドット絵・透過） =======================
   16x16 のドット絵。差し替えは ASSET_MANIFEST の ui_* を置き換えるだけ。
   ------------------------------------------------------------------------- */
function px(map, pal, scale) {
  const h = map.length, w = map[0].length, g = new Grid(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = map[y][x];
    if (c !== '.' && pal[c]) g.set(x, y, pal[c]);
  }
  return svgUri(g.paths(), w, h, scale || 14);
}

/* しあいで使うボール（ドット絵・透過） */
function makeBallIcon() {
  const N = 13, g = new Grid(N, N), c = 6, r = 5.4;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const nx = (x - c) / r, ny = (y - c) / r;
    if (nx * nx + ny * ny <= 1) g.set(x, y, (nx + ny > 0.5) ? '#dfe4d6' : '#fdfef7');
  }
  [[2, 4], [3, 3], [4, 2], [5, 2], [6, 2]].forEach(p => g.over(p[0], p[1], '#0f7a4f'));
  [[7, 3], [8, 4], [9, 5], [9, 6]].forEach(p => g.over(p[0], p[1], '#0f7a4f'));
  [[4, 7], [5, 8], [6, 9], [7, 10]].forEach(p => g.over(p[0], p[1], '#0f7a4f'));
  g.set(4, 3, '#ffffff');
  g.outline(DARK);
  return svgUri(g.paths(), N, N, 14);
}

function zero(keys) { const o = {}; keys.forEach(k => o[k] = 0); return o; }

function createCreature(now, generationNo) {

    status: { hp: 100, mood: 100, food: 100, clean: 100, fatigue: 0 },

function createInitialState() {

  return {
    schemaVersion: CONFIG.schemaVersion,

    generationNo: 1,
    currentCreature: createCreature(now, 1),

function dayKeyOf(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

let state = null;
function nowMs() { return Date.now() + (state ? state.clockOffset : 0); }

/* ============================ 7. Storage ============================
   localStorage を主保存先とする。ファイルを直接開いた場合や
   プライベートブラウズでは使えないことがあるため、
   その場合はメモリ上に保持して動作は継続し、画面で注意を伝える。
   -------------------------------------------------------------------- */
const LS = (function () {
  let ok = false;
  try { const k = '__sg_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); ok = true; } catch (e) { ok = false; }
  const mem = Object.create(null);
  return {
    available: ok,
    get(k) { if (ok) { try { return localStorage.getItem(k); } catch (e) { } } return k in mem ? mem[k] : null; },
    set(k, v) { if (ok) { localStorage.setItem(k, v); return; } mem[k] = v; },
    remove(k) { if (ok) { try { localStorage.removeItem(k); } catch (e) { } } delete mem[k]; }
  };
})();
const Storage = {
  save() {
    try {
      const prev = LS.get(CONFIG.saveKey);
      if (prev) LS.set(CONFIG.backupKey, prev);   // 1世代前を保持
      LS.set(CONFIG.saveKey, JSON.stringify(state));
      return true;
    } catch (e) {
      // 容量超過時はアルバムのサムネイルを捨てて再試行
      try {
        state.album.forEach(a => delete a.thumb);
        LS.set(CONFIG.saveKey, JSON.stringify(state));
        toast('保存容量が足りないため、アルバムの画像だけ 消しました', 'bad');
        return true;
      } catch (e2) { toast('保存できませんでした。設定から バックアップを 保存してください', 'bad'); return false; }
    }
  },
  load() {
    const raw = LS.get(CONFIG.saveKey);
    if (!raw) return null;
    try { return migrateSave(JSON.parse(raw)); }
    catch (e) {
      try {
        const b = LS.get(CONFIG.backupKey);
        if (b) { toast('保存データが壊れていたため、1つ前の記録から 復元しました', 'bad'); return migrateSave(JSON.parse(b)); }
      } catch (e2) { }
      return null;
    }
  },
  hasSave() { return !!LS.get(CONFIG.saveKey); },
  clear() { LS.remove(CONFIG.saveKey); LS.remove(CONFIG.backupKey); },
  exportJson() {
    const data = JSON.parse(JSON.stringify(state));
    data.album = data.album.map(a => { const c = Object.assign({}, a); delete c.thumb; return c; }); // 写真本体は対象外
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'sangaiatch_backup_' + dayKeyOf(nowMs()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  importJson(text) {
    const obj = JSON.parse(text);
    if (!obj || !obj.currentCreature) throw new Error('形式が違います');
    state = migrateSave(obj);
    Storage.save();
  }
};
/* 将来のキャラ追加・項目追加に備えた移行処理 */
function migrateSave(s) {
  const base = createInitialState();
  const out = Object.assign({}, base, s);
  out.currentCreature = Object.assign({}, base.currentCreature, s.currentCreature || {});
  ['status', 'abilities', 'personalityScores', 'traitScores', 'trainCounts', 'foodCounts', 'careCounts', 'style', 'records']
    .forEach(k => out.currentCreature[k] = Object.assign({}, base.currentCreature[k], (s.currentCreature || {})[k] || {}));
  // 旧形式（時刻で成長）からの移行
  const cc = out.currentCreature, nw = Date.now();
  if (typeof cc.growthMs !== 'number') cc.growthMs = clamp(nw - (cc.stageStartedAt || nw), 0, STAGE_MS[cc.stage] || 0);
  if (typeof cc.lastTickAt !== 'number') cc.lastTickAt = nw;
  if (typeof cc.neglectMs !== 'number') cc.neglectMs = 0;
  cc.charges = Object.assign({}, base.currentCreature.charges, cc.charges || {});
  ['train', 'match'].forEach(k => {
    if (!cc.charges[k] || typeof cc.charges[k].n !== 'number')
      cc.charges[k] = { n: CONFIG.chargeSpec[k].max, nextAt: nw + CONFIG.chargeSpec[k].every };
  });
  out.daily = Object.assign({}, base.daily, s.daily || {});
  out.daily.used = Object.assign({}, base.daily.used, (s.daily || {}).used || {});
  if (typeof out.matchGame === 'undefined') out.matchGame = null;
  out.stamps = Object.assign({}, base.stamps, s.stamps || {});
  // 旧形式（キャラ区別なし）からの移行：いまの子のぶんとして引き継ぐ
  if (!out.stamps.owned) {
    const cid = (out.currentCreature && out.currentCreature.characterId) || 'ball';
    const o = {};
    (s.stamps && s.stamps.unlockedIds || []).forEach(id => {
      if (STAMP_MASTER[id]) o[id] = (s.stamps.unlockedAt || {})[id] || Date.now();
    });
    out.stamps.owned = {}; out.stamps.owned[cid] = o;
  }
  Object.keys(out.stamps.owned).forEach(cid => {
    if (!CHARS[cid]) { delete out.stamps.owned[cid]; return; }
    Object.keys(out.stamps.owned[cid]).forEach(id => { if (!STAMP_MASTER[id]) delete out.stamps.owned[cid][id]; });
  });
  delete out.stamps.unlockedIds; delete out.stamps.unlockedAt; delete out.stamps.newIds;
  out.stamps.newKeys = out.stamps.newKeys || [];
  out.collection = Object.assign({ posi: {}, player: {} }, s.collection || {});
  out.settings = Object.assign({}, base.settings, s.settings || {});
  out.memories = Array.isArray(s.memories) ? s.memories : [];
  out.album = Array.isArray(s.album) ? s.album : [];
  out.pending = Array.isArray(s.pending) ? s.pending : [];
  out.ui = Object.assign({}, base.ui, s.ui || {});
  out.schemaVersion = CONFIG.schemaVersion;
  return out;
}
/* ============================ 8. GameEngine ============================ */
const NEED_KEY = { meal: 'food', rest: 'hp', bath: 'clean', talk: 'mood' };
const NEED_ORDER = ['food', 'hp', 'clean', 'mood'];
const NEED_LABEL = { food: 'おなか', hp: 'げんき', clean: 'きれい', mood: 'きげん' };
/* おせわボタンの ならびに あわせた ステータスの 順番 */
const NEED_BY_CARE = Object.keys(NEED_KEY).map(k => NEED_KEY[k]);
const ASK_MSG = { food: 'おなか すいた…', hp: 'ねむい…', clean: 'べたべた する…', mood: 'かまって ほしい…' };
const SOON_MSG = { food: 'そろそろ ごはん？', hp: 'すこし やすみたい', clean: 'ちょっと よごれた', mood: 'あそぼうよ' };
const DONE_MSG = { meal: 'もぐもぐ', rest: 'ぐっすり…', bath: 'さっぱり！', talk: 'うれしそう！' };
const FULL_MSG = { meal: 'おなか いっぱい', rest: 'よく ねたよ', bath: 'じゅうぶん きれい', talk: 'いま たのしいよ' };

const Engine = {

  /* ---------- 欲求の状態 ---------- */
  rates() { return CONFIG.needRates[state.currentCreature.stage] || CONFIG.needRates.player; },
  needLevel(k) { return state.currentCreature.status[k]; },
  asking() {   // 「お世話して」と言っているもの（こまっている順）
    const s = state.currentCreature.status;
    return NEED_ORDER.filter(k => s[k] < CONFIG.needAsk).sort((a, b) => s[a] - s[b]);
  },
  wanting() {  // まだ満たされていないもの
    const s = state.currentCreature.status;
    return NEED_ORDER.filter(k => s[k] < CONFIG.needFull).sort((a, b) => s[a] - s[b]);
  },
  needState(k) {
    const v = state.currentCreature.status[k];
    return v < CONFIG.needAsk ? 'ask' : (v < CONFIG.needFull ? 'soon' : 'full');
  },

  /* ---------- 時間処理 ---------- */
  tick() {
    const c = state.currentCreature, now = nowMs();
    let changed = false;
    const dk = dayKeyOf(now);
    if (state.daily.dayKey !== dk) { state.daily = { dayKey: dk, used: { treat: 0 } }; changed = true; }
    let dt = now - (c.lastTickAt || now);
    if (dt < 0) { c.lastTickAt = now; dt = 0; }
    if (dt > 1000) { Engine.advance(dt); c.lastTickAt = now; changed = true; }
    if (Engine.regenCharges(now)) changed = true;
    if (changed) Storage.save();
    return changed;
  },

  /* 離れていた時間も、こまめに刻んで進める（放置ぶんは成長がゆっくり） */
  advance(dt) {
    const c = state.currentCreature;
    const STEP = 20 * 60 * 1000;
    let remain = dt, guard = 0;
    while (remain > 0 && guard++ < 800) {
      const d = Math.min(STEP, remain);
      Engine.stepNeeds(d);
      Engine.stepGrowth(d, Engine.growthRate());
      remain -= d;
    }
    if (remain > 0) { Engine.stepNeeds(remain); Engine.stepGrowth(remain, CONFIG.neglect.growthMin); }
  },
  stepNeeds(dt) {
    const c = state.currentCreature, s = c.status, hrs = dt / CONFIG.hour, r = Engine.rates();
    const others = ['food', 'hp', 'clean'].filter(k => s[k] < CONFIG.needAsk).length;
    s.food = clamp(s.food - r.food * hrs, 0, 100);
    s.hp = clamp(s.hp - r.hp * hrs, 0, 100);
    s.clean = clamp(s.clean - r.clean * hrs, 0, 100);
    s.mood = clamp(s.mood - r.mood * (1 + CONFIG.neglect.moodExtra * others) * hrs, 0, 100);
    s.fatigue = clamp(s.fatigue - CONFIG.fatigueDownPerHour * hrs, 0, 100);
    const neg = Engine.asking().length;
    if (neg) c.neglectMs += dt;
    const severe = Math.max(0, neg - 2);        // 3つ以上ほうっておくと ちからが おちる
    if (severe) {
      const dec = CONFIG.neglect.abilityPerHour * severe * hrs;
      Object.keys(c.abilities).forEach(k => c.abilities[k] = clamp(c.abilities[k] - dec, 1, 100));
      c.traitScores.tsundere += 0.6 * hrs;
      c.personalityScores.cool += 0.3 * hrs;
    }
  },
  stepGrowth(dt, rate) {
    const c = state.currentCreature;
    if (c.stage === 'retired') return;
    c.growthMs += dt * rate;
    let guard = 0;
    while (c.stage !== 'retired' && c.growthMs >= STAGE_MS[c.stage] && guard++ < 6) {
      c.growthMs -= STAGE_MS[c.stage];
      Engine.resolveGrowth();
    }
  },
  growthRate() {
    return clamp(1 - CONFIG.neglect.growthPer * Engine.asking().length, CONFIG.neglect.growthMin, 1);
  },
  stageProgress() {
    const c = state.currentCreature;
    if (c.stage === 'retired') return 1;
    return clamp(c.growthMs / STAGE_MS[c.stage], 0, 1);
  },

  /* ---------- ストック（れんしゅう・しあい） ---------- */
  regenCharges(now) {
    let changed = false;
    ['train', 'match'].forEach(k => {
      const sp = CONFIG.chargeSpec[k], ch = state.currentCreature.charges[k];
      if (!ch) return;
      let guard = 0;
      while (ch.n < sp.max && now >= ch.nextAt && guard++ < 200) { ch.n++; ch.nextAt += sp.every; changed = true; }
      if (ch.n >= sp.max || ch.nextAt < now) ch.nextAt = now + sp.every;
    });
    return changed;
  },
  charge(kind) {
    const sp = CONFIG.chargeSpec[kind], ch = state.currentCreature.charges[kind] || { n: 0, nextAt: nowMs() + sp.every };
    const full = ch.n >= sp.max;
    const left = full ? 0 : Math.max(0, ch.nextAt - nowMs());
    return { n: ch.n, max: sp.max, full: full, left: left, pct: full ? 1 : clamp(1 - left / sp.every, 0, 1) };
  },
  useCharge(kind) {
    const sp = CONFIG.chargeSpec[kind], ch = state.currentCreature.charges[kind];
    if (!ch || ch.n <= 0) return false;
    if (ch.n >= sp.max) ch.nextAt = nowMs() + sp.every;
    ch.n--;
    return true;
  },
  canAct(kind) {
    const c = state.currentCreature;
    if (c.stage === 'retired') return false;
    if (kind === 'care') return true;
    if (kind === 'treat') return (state.daily.used.treat || 0) < CONFIG.dailyLimits.treat;
    return Engine.charge(kind).n > 0;
  },
  markActive() {
    const c = state.currentCreature, dk = dayKeyOf(nowMs());
    c.records.actions++;
    if (c.records.lastActiveDay !== dk) { c.records.lastActiveDay = dk; c.records.activeDays++; }
  },
  afterAction() { Engine.checkStamps(); Storage.save(); },

  /* ---------- おせわ（回数無制限・満たされたら不要） ---------- */
  doCare(type) {
    const c = state.currentCreature, s = c.status, p = c.personalityScores, t = c.traitScores;
    const key = NEED_KEY[type];
    if (s[key] >= CONFIG.needFull) return { full: true, msg: FULL_MSG[type] };
    const wasAsking = s[key] < CONFIG.needAsk;
    s[key] = 100;
    if (type === 'meal') { t.kuishin += 2; p.mypace += 1; }
    if (type === 'rest') { s.fatigue = 0; p.ottori += 2; p.mypace += 1; }
    if (type === 'bath') { s.mood = clamp(s.mood + 8, 0, 100); t.oshare += 3; p.majime += 1; }
    if (type === 'talk') { p.shakou += 3; p.akarui += 2; t.amaenbo += 2; if (wasAsking) t.tsundere += 3; }
    if (wasAsking) { p.majime += 2; t.sewazuki += 2; }
    else { p.ottori += 1; t.sewazuki += 1; }
    c.careCounts[type]++;
    Engine.markActive();
    Engine.afterAction();
    return { full: false, msg: DONE_MSG[type] };
  },

  /* ---------- れんしゅう（3時間に1回・最大3ストック） ---------- */
  doTrain(type) {
    const c = state.currentCreature, s = c.status, p = c.personalityScores, t = c.traitScores;
    if (!Engine.useCharge('train')) return null;
    const ab = TRAINS[type].ab;
    const tired = s.fatigue > 70, hungry = s.food < CONFIG.needAsk, weak = s.hp < CONFIG.needAsk;
    let gain = 3.4 + (s.mood > 70 ? 1.6 : 0) + (s.food > 60 ? 0.8 : 0);
    if (tired) gain *= 0.55;
    if (hungry || weak) gain *= 0.6;
    const genius = Math.random() < 0.12;
    if (genius) { gain *= 1.9; t.tensai += 3; }
    c.abilities[ab] = clamp(c.abilities[ab] + gain, 0, 100);
    /* 練習すると おせわが 必要になる */
    s.food = clamp(s.food - 26, 0, 100);
    s.hp = clamp(s.hp - 22, 0, 100);
    s.clean = clamp(s.clean - 16, 0, 100);
    s.mood = clamp(s.mood - (tired ? 10 : 5), 0, 100);
    s.fatigue = clamp(s.fatigue + 18, 0, 100);
    p.nekketsu += 2; p.majime += 1; t.doryoku += (s.fatigue > 45 ? 2 : 1);
    if (tired) { t.doryoku += 3; p.nekketsu += 2; }
    if (weak) { t.makezu += 2; p.cool += 1; }
    if (type === 'tactics') { p.cool += 2; c.style.strategy += 2; }
    if (type === 'stretch') { p.ottori += 2; c.style.combo += 1; }
    if (type === 'dash') p.akarui += 1;
    if (type === 'power') { p.nekketsu += 1; t.makezu += 1; }
    if (type === 'jump') { p.akarui += 1; t.doryoku += 1; }
    c.trainCounts[type]++;
    Engine.markActive();
    Engine.afterAction();
    return { gain: Math.round(gain * 10) / 10, ab, genius, tired, hungry };
  },

  /* ---------- さしいれ（1日1回） ---------- */
  doTreat(type) {
    const c = state.currentCreature, s = c.status, p = c.personalityScores, t = c.traitScores;
    s.food = clamp(s.food + 34, 0, 100);
    s.mood = clamp(s.mood + 24, 0, 100);
    s.hp = clamp(s.hp + 10, 0, 100);
    t.kuishin += 4;
    ({ meat: () => { p.nekketsu += 2; t.makezu += 1; }, rice: () => { p.majime += 2; },
      veg: () => { p.cool += 2; t.oshare += 1; }, snack: () => { p.itazura += 2; p.akarui += 1; } })[type]();
    c.foodCounts[type]++;
    state.daily.used.treat = (state.daily.used.treat || 0) + 1;
    Engine.markActive();
    Engine.afterAction();
    return FOODS[type].name + '、うまい！';
  },

  /* ---------- しあい結果の反映（4時間に1回・最大3ストック） ----------
     res: { game, grade:'fail'|'ok'|'great', abKey, abKey2, styleKey } */
  applyMatch(res) {
    const c = state.currentCreature, s = c.status, p = c.personalityScores, t = c.traitScores;
    const G = GRADES[res.grade];
    c.abilities[res.abKey] = clamp(c.abilities[res.abKey] + G.gain, 0, 100);
    if (res.abKey2) c.abilities[res.abKey2] = clamp(c.abilities[res.abKey2] + G.gain * 0.5, 0, 100);
    c.style[res.styleKey] += G.style;
    c.spirit += G.spirit;
    /* しあいのあとも おせわが 必要になる */
    s.food = clamp(s.food - 26, 0, 100);
    s.hp = clamp(s.hp - 24, 0, 100);
    s.clean = clamp(s.clean - 18, 0, 100);
    s.mood = clamp(s.mood + G.mood, 0, 100);
    s.fatigue = clamp(s.fatigue + 22, 0, 100);
    c.records.matches++;
    if (res.grade !== 'fail') { c.records.wins++; p.akarui += 2; t.makezu += 1; }
    else { p.majime += 2; t.doryoku += 2; t.makezu += 2; }

    p.nekketsu += 2;

  /* ---------- ふきだし・表情 ---------- */
  message() {
    const c = state.currentCreature, s = c.status;
    if (c.stage === 'retired') return 'ありがとう';
    const ask = Engine.asking();
    if (ask.length) return ASK_MSG[ask[0]];
    if (s.fatigue > 75) return 'ちょっと つかれた';
    const want = Engine.wanting();
    if (want.length) return SOON_MSG[want[0]];
    const tips = ['げんき いっぱい！', 'ボールを ついている', 'コートに 立ちたい', 'いい かんじ'];
    return tips[Math.floor(nowMs() / 60000) % tips.length];

  face() {
    const c = state.currentCreature, s = c.status;
    if (c.stage === 'retired') return 'win';
    const ask = Engine.asking();
    if (ask.indexOf('hp') >= 0 || s.fatigue > 85) return 'sleep';
    if (ask.length) return 'sad';
    if (s.fatigue > 70) return 'sleep';
    if (!Engine.wanting().length) return 'happy';
    return 'idle';
  },

  /* ================= 成長抽選 ================= */
  resolveGrowth() {
    const c = state.currentCreature;
    if (c.stage === 'ball') {
      const r = Engine.pickPosi();
      c.stage = 'posi'; c.posiId = r.id; c.characterId = r.id;
      c.stageStartedAt = nowMs();
      c.growthSeed = (c.growthSeed * 1664525 + 1013904223) >>> 0;
      Engine.discover('posi', r.id);
      state.ui.stampChar = r.id; state.ui.photoChar = r.id;
      state.pending.push({ kind: 'posi', from: 'ball', to: r.id, at: nowMs() });
    } else if (c.stage === 'posi') {
      const r = Engine.pickPlayer();
      c.stage = 'player'; c.playerId = r.id; c.characterId = r.id;
      c.stageStartedAt = nowMs();
      c.growthSeed = (c.growthSeed * 1664525 + 1013904223) >>> 0;
      Engine.discover('player', r.id);
      state.ui.stampChar = r.id; state.ui.photoChar = r.id;
      state.pending.push({ kind: 'player', from: c.posiId, to: r.id, at: nowMs() });
    } else if (c.stage === 'player') {
      const mem = Engine.retire();
      c.stage = 'retired';
      state.lastRetire = mem.memoryId;
    }
    Engine.checkStamps();
  },

  metrics() {
    const c = state.currentCreature;
    const tTot = sum(c.trainCounts), fTot = sum(c.foodCounts), cTot = sum(c.careCounts);
    const ratio = (o, keys, tot) => tot ? keys.reduce((a, k) => a + o[k], 0) / tot : 0;
    const evenness = o => {
      const v = Object.values(o), n = v.length, tot = v.reduce((a, b) => a + b, 0);
      if (!tot) return 0;
      const ideal = tot / n;
      const dev = v.reduce((a, b) => a + Math.abs(b - ideal), 0) / (2 * tot * (n - 1) / n);
      return clamp(1 - dev, 0, 1);
    };
    return { tTot, fTot, cTot, ratio, evenness };
  },

  pickPosi() {
    const c = state.currentCreature, m = Engine.metrics();
    const rng = makeRng(c.growthSeed);
    const bal = Math.pow(m.evenness(c.trainCounts) * 0.55 + m.evenness(c.foodCounts) * 0.25 + m.evenness(c.careCounts) * 0.20, 2);
    const gaiaP = CONFIG.gaiaBase + (CONFIG.gaiaMax - CONFIG.gaiaBase) * bal;
    if (m.tTot >= 3 && rng() < gaiaP) return { id: 'gaia' };
    const life = {
      rest: m.cTot ? c.careCounts.rest / m.cTot : 0,
      active: clamp(c.records.actions / 16, 0, 1),
      regular: m.evenness(c.careCounts),
      talk: m.cTot ? c.careCounts.talk / m.cTot : 0,
      care: (m.cTot + m.tTot) ? m.cTot / (m.cTot + m.tTot) : 0,
      balance: bal
    };
    const cands = POSI_ORDER.filter(id => id !== 'gaia').map(id => {
      const p = POSITIONS[id];
      const tr = m.ratio(c.trainCounts, p.trains, m.tTot);
      const fr = m.ratio(c.foodCounts, p.foods, m.fTot);
      const lf = life[p.life] || 0;
      return { id, rarity: 1, score: tr * 52 + fr * 26 + lf * 22 + rng() * 6 };
    });
    return { id: weightedPick(cands, rng, CONFIG.posiTemperature) };
  },

  pickPlayer() {
    const c = state.currentCreature, m = Engine.metrics();
    const rng = makeRng(c.growthSeed ^ 0x5bf03635);
    const pMax = Math.max(1, ...Object.values(c.personalityScores));
    const styleTot = c.style.combo + c.style.strategy;
    const volKind = m.tTot >= 17 ? 'many' : (m.tTot >= 8 ? 'mid' : 'few');
    const spiritKind = c.spirit >= 12 ? 'strong' : 'normal';
    const cands = PLAYER_ORDER.filter(id => PLAYERS[id].from.indexOf(c.posiId) >= 0).map(id => {
      const p = PLAYERS[id];
      const persV = c.personalityScores[p.pers] / pMax;
      const volV = p.vol === volKind ? 1 : (Math.abs(['few', 'mid', 'many'].indexOf(p.vol) - ['few', 'mid', 'many'].indexOf(volKind)) === 1 ? 0.45 : 0.1);
      const mainV = m.tTot ? c.trainCounts[p.main] / m.tTot : 0;
      const styleV = styleTot ? (p.style === 'combo' ? c.style.combo : c.style.strategy) / styleTot : 0.5;
      const spiritV = p.spirit === spiritKind ? 1 : 0.35;
      return { id, rarity: p.rarity, score: persV * 30 + volV * 18 + mainV * 24 + styleV * 18 + spiritV * 10 + rng() * 6 };
    });
    if (!cands.length) cands.push({ id: 'gaian', score: 50, rarity: 1 });
    return { id: weightedPick(cands, rng, CONFIG.playerTemperature) };
  },

  /* ================= 引退・思い出 ================= */
  decidePersonality() {
    const c = state.currentCreature, keys = Object.keys(PERSONALITIES);
    let best = keys[0];
    keys.forEach(k => { if (c.personalityScores[k] > c.personalityScores[best]) best = k; });
    if (c.personalityScores[best] === 0) best = 'mypace';
    const tKeys = Object.keys(TRAITS).slice().sort((a, b) => c.traitScores[b] - c.traitScores[a]);
    return { base: best, traits: tKeys.filter(k => c.traitScores[k] >= 8).slice(0, 2) };
  },
  displayName(base, traits, charId) {
    const nm = charName(charId);
    if (traits.length) return traits.map(t => TRAITS[t].name).join('で') + 'な' + nm;
    return PERSONALITIES[base].adj + nm;
  },
  retire() {
    const c = state.currentCreature, now = nowMs();
    const { base, traits } = Engine.decidePersonality();
    const titles = TITLES.filter(t => { try { return t.test(c); } catch (e) { return false; } }).map(t => t.id);
    const key = c.playerId + '|' + base + '|' + traits.slice().sort().join(',');
    const sameChar = state.memories.filter(m => m.characterId === c.playerId).length;
    const mem = {
      memoryId: uid('mem'), generationNo: state.generationNo,
      characterId: c.playerId, posiId: c.posiId,
      displayName: Engine.displayName(base, traits, c.playerId),
      no: (PLAYERS[c.playerId] || {}).no || '',
      basePersonality: base, traits, titles, comboKey: key,
      abilities: Object.assign({}, c.abilities),
      favoriteFood: argmax(c.foodCounts), mainTrain: argmax(c.trainCounts),
      records: { bornAt: c.bornAt, retiredAt: now, matches: c.records.matches, wins: c.records.wins, actions: c.records.actions, activeDays: c.records.activeDays, photos: c.records.photos },
      face: 'win', assetKey: 'char_' + c.playerId + '_win',
      firstFind: sameChar === 0, sameCharIndex: sameChar + 1,
      firstCombo: !state.memories.some(m => m.comboKey === key),
      unlockedStampIds: [], albumCount: c.records.photos,
      comment: Engine.comment(base, traits, c)
    };
    state.memories.unshift(mem);
    Engine.checkStamps(mem);
    mem.unlockedStampIds = [];
    Storage.save();
    return mem;
  },
  comment(base, traits, c) {
    const parts = [PERSONALITIES[base].name + 'な こだった。'];
    parts.push('しあい' + c.records.matches + '回、せいこう' + c.records.wins + '回。');
    return parts.join(' ');
  },
  nextGeneration() {
    const now = nowMs();
    state.generationNo++;
    state.currentCreature = createCreature(now, state.generationNo);
    state.pending = []; state.lastRetire = null; state.matchGame = null;
    Engine.checkStamps();
    Storage.save();
  },

  /* ================= 図鑑・スタンプ ================= */
  discover(kind, id) {
    const col = state.collection[kind];
    if (!col[id]) col[id] = { count: 0, firstAt: nowMs() };
    col[id].count++;
  },
  /* スタンプは「そのすがたの子」が じぶんで 手に入れる。
     すがたが かわれば、また はじめから 集めなおす。 */
  ownedOf(charId) { return (state.stamps.owned && state.stamps.owned[charId]) || null; },
  hasStamp(charId, id) { const o = Engine.ownedOf(charId); return !!(o && o[id]); },
  stampChars() {
    return Object.keys(state.stamps.owned || {}).filter(cid => CHARS[cid] && Object.keys(state.stamps.owned[cid]).length);
  },
  countOwned() { return Engine.stampChars().reduce((a, cid) => a + Object.keys(state.stamps.owned[cid]).length, 0); },
  checkStamps(memOpt) {
    const c = state.currentCreature, st = state.stamps, got = [];
    const cid = c.characterId || 'ball';
    st.owned = st.owned || {};
    const own = st.owned[cid] = st.owned[cid] || {};
    const myPhotos = c.records.photos;
    const traitsNow = {}, persNow = {};
    Object.keys(TRAITS).forEach(k => { if (c.traitScores[k] >= 8) traitsNow[k] = 1; });
    const lead = Engine.decidePersonality();
    if (sum(c.personalityScores) > 0) persNow[lead.base] = 1;
    if (memOpt && memOpt.characterId === cid) {
      persNow[memOpt.basePersonality] = 1;
      (memOpt.traits || []).forEach(t => traitsNow[t] = 1);
    }
    STAMP_ORDER.forEach(id => {
      if (own[id]) return;
      const cd = STAMP_MASTER[id].cond;
      let ok = false;
      switch (cd.type) {
        case 'always': ok = true; break;
        case 'wins': ok = c.records.wins >= cd.value; break;
        case 'matches': ok = c.records.matches >= cd.value; break;
        case 'trainTotal': ok = sum(c.trainCounts) >= cd.value; break;
        case 'careTotal': ok = c.careCounts[cd.key] >= cd.value; break;
        case 'photos': ok = myPhotos >= cd.value; break;
        case 'memories': ok = state.memories.length >= cd.value; break;
        case 'generation': ok = state.generationNo >= cd.value; break;
        case 'trait': ok = !!traitsNow[cd.key]; break;
        case 'personality': ok = !!persNow[cd.key]; break;
        case 'character': ok = !!(state.collection.player[cd.key]); break;
        case 'posi': ok = !!(state.collection.posi[cd.key]); break;
      }
      if (ok) { own[id] = nowMs(); st.newKeys.push(cid + '|' + id); got.push(id); }
    });
    if (got.length) state.ui.menuBadge = true;
    return got;
  }
};

/* softmax抽選（seed固定で同一結果／rarityで希少度補正） */
function weightedPick(cands, rng, temperature) {
  const w = cands.map(c => Math.exp(c.score / temperature) * (c.rarity || 1));
  const tot = w.reduce((a, b) => a + b, 0);
  let r = rng() * tot;
  for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) return cands[i].id; }
  return cands[cands.length - 1].id;
}
function argmax(o) { let b = null; Object.keys(o).forEach(k => { if (b === null || o[k] > o[b]) b = k; }); return o[b] ? b : null; }
/* ============================ 8. Renderer ============================ */
const NOTE = { C: 523, D: 587, E: 659, F: 698, G: 784, A: 880, B: 988, C2: 1046, D2: 1175, E2: 1319, F2: 1397, G2: 1568, A2: 1760, C3: 2093 };
/* ===================== 音（BGMとSE） =====================
   SE  … 矩形波の電子音。画面がかわるときは「ピロピロー」、
          おせわなどの その場の操作は「ピコン」。
   BGM … ASSET_MANIFEST の bgm_main を そのまま <audio> で ループ再生。
   どちらも 設定が ONで、かつ 一度でも 画面を さわってから 鳴らす
   （ブラウザは 操作なしの 自動再生を 止めるため）。
   ------------------------------------------------------- */
const Sound = {
  ctx: null, unlocked: false,
  ensure() {
    if (!state || !state.settings.sound) return null;
    if (!Sound.ctx) { try { Sound.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (Sound.ctx.state === 'suspended') { try { Sound.ctx.resume(); } catch (e) { } }
    return Sound.ctx;
  },
  /* seq: [周波数, 長さ(ms)] の並び。0 は 休符。 */
  play(seq, vol, type) {
    const c = Sound.ensure(); if (!c) return;
    const v = vol === undefined ? 0.09 : vol;
    let t = c.currentTime + 0.005;
    seq.forEach(n => {
      const f = n[0], d = n[1] / 1000;
      if (f > 0) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0, t);
        g.gain.setValueAtTime(v, t + 0.002);
        g.gain.setValueAtTime(v, t + Math.max(0.004, d - 0.006));
        g.gain.setValueAtTime(0, t + Math.max(0.005, d - 0.004));
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d);
      }
      t += d;
    });
  },
  /* 上下する短い音を つないで「ピロピロー」にする */
  sweep(from, to, ms, vol) {
    const c = Sound.ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + 0.005, d = ms / 1000;
    o.type = 'square';
    o.frequency.setValueAtTime(from, t);
    o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0, t);
    g.gain.setValueAtTime(vol === undefined ? 0.075 : vol, t + 0.002);
    g.gain.setValueAtTime(vol === undefined ? 0.075 : vol, t + d - 0.01);
    g.gain.setValueAtTime(0, t + d - 0.005);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.01);
  },

  /* --- SE --- */
  /* 画面が かわるとき：ピロピロー */
  page() {
    Sound.play([[NOTE.C2, 38], [NOTE.E2, 38], [NOTE.C2, 38], [NOTE.E2, 38]], 0.06);
    setTimeout(() => Sound.sweep(NOTE.E2, NOTE.C3, 150, 0.07), 152);
  },
  /* その場の操作（おせわ・れんしゅう など）：ピコン */
  pico() { Sound.play([[NOTE.C2, 34], [NOTE.G2, 90]], 0.085); },
  tap() { Sound.play([[NOTE.C2, 40]], 0.07); },
  back() { Sound.play([[NOTE.E2, 40], [NOTE.C2, 70]], 0.065); },
  good() { Sound.play([[NOTE.G, 55], [NOTE.C2, 80]]); },
  great() { Sound.play([[NOTE.C2, 55], [NOTE.E2, 55], [NOTE.G2, 130]]); },
  bad() { Sound.play([[NOTE.E, 60], [0, 25], [NOTE.C, 130]], 0.08); },
  call() { Sound.play([[NOTE.C2, 70], [0, 45], [NOTE.C2, 70], [0, 45], [NOTE.C2, 70]], 0.09); },
  grow() { Sound.play([[NOTE.C, 70], [NOTE.E, 70], [NOTE.G, 70], [NOTE.C2, 70], [NOTE.E2, 70], [NOTE.G2, 220]]); },

  /* --- BGM --- */
  el: null,
  bgmOn() { return !!(state && state.settings.bgm); },
  initBgm() {
    if (Sound.el) return Sound.el;
    try {
      const a = document.createElement('audio');
      a.loop = true; a.preload = 'auto'; a.volume = 0.42;
      a.src = getAsset('bgm_main');
      a.setAttribute('playsinline', '');
      Sound.el = a;
    } catch (e) { Sound.el = null; }
    return Sound.el;
  },
  /* メインの育成画面で 流す。しあいは リズムを 聞き取るため 止める。 */
  bgmScreens: { 'SC-02': 1, 'SC-03': 1, 'SC-04': 1, 'SC-05': 1, 'SC-07': 1, 'SC-11': 1 },
  syncBgm() {
    const want = Sound.unlocked && Sound.bgmOn() && !!Sound.bgmScreens[state.ui.screen];
    const a = want ? Sound.initBgm() : Sound.el;
    if (!a) return;
    if (want) { if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => { }); } }
    else if (!a.paused) { a.pause(); }
  },
  /* 最初の操作で 音を つかえるようにする */
  unlock() {
    if (Sound.unlocked) return;
    Sound.unlocked = true;
    Sound.ensure();
    Sound.syncBgm();
  },
  stopAll() { if (Sound.el && !Sound.el.paused) Sound.el.pause(); }
};

}
function statRow(label, val, kind) { return '<div class="st"><span class="lb">' + label + '</span>' + dots(val, kind) + '</div>'; }
/* おせわボタン：どの世話が どのステータスに 効くかを ひと目で わかるようにする */

function stageBlock(o) {
  o = o || {};
  const c = state.currentCreature;

    (o.say ? '<div class="say">' + esc(o.say) + '</div>' : '') +

/* ならびは おせわボタンと 同じ順（ごはん・やすむ・おふろ・はなす） */
function statsBlock() {
  const s = state.currentCreature.status;
  return '<div class="stats">' +
    NEED_BY_CARE.map(k => statRow(NEED_LABEL[k], s[k], 'warn')).join('') +
    '</div>';
}
function abilityBlock(ab) {
  return Object.keys(ABILITIES).map(k =>
    '<div class="ab"><span>' + ABILITIES[k] + '</span>' + dots(ab[k]) + '</div>').join('');
}
/* ico にはアイコンのキー（ui_ を除いた名前）を渡す。空なら画像なし。 */
function bigBtn(act, arg, ico, title, cnt, cls) {
  return '<button class="btn ' + (cls || '') + '" data-act="' + act + '" data-arg="' + esc(arg) + '">' +
    (ico ? '<img class="ic" src="' + getAsset('ui_' + ico) + '" alt="">' : '') + esc(title) +
    (cnt !== undefined && cnt !== null ? '<span class="cnt">' + cnt + '</span>' : '') + '</button>';
}
/* ストックの残り（回復中のぶんは途中まで色がつく） */
function chargeDots(kind) {
  const ch = Engine.charge(kind);
  let o = '';
  for (let i = 0; i < ch.max; i++) {
    if (i < ch.n) o += '<i class="on"></i>';
    else if (i === ch.n) {
      const p = Math.round(ch.pct * 100);
      o += '<i style="background:linear-gradient(90deg,var(--shell) ' + p + '%,#d5ddd0 ' + p + '%)"></i>';
    } else o += '<i></i>';
  }
  return '<span class="dots">' + o + '</span>';
}
/* 「あと◯ふんで かいふく」の文言 */
function rechargeText(kind) {
  const ch = Engine.charge(kind);
  if (ch.full) return 'まんタン';
  const m = Math.ceil(ch.left / 60000);
  if (m >= 60) { const h = Math.floor(m / 60); return 'あと' + h + 'じかん' + (m % 60) + 'ふん'; }
  return 'あと' + m + 'ふん';
}
function chargeRow(kind) {
  return '<span class="rechg">' + chargeDots(kind) + '<span>' + rechargeText(kind) + '</span></span>';
}
/* キャラ切り替えタブ */
function charTabs(chars, cur, key) {
  return '<div class="chartabs">' + chars.map(cid => {
    const n = Object.keys(Engine.ownedOf(cid) || {}).length;
    return '<button class="' + (cid === cur ? 'on' : '') + '" data-act="pickChar" data-arg="' + key + ':' + cid + '">' +
      '<img src="' + charAsset(cid, 'happy') + '" alt="">' + esc(charName(cid).replace('っち', '')) +
      '<span class="cnum">' + n + '</span></button>';
  }).join('') + '</div>';
}
/* おせわが必要なものを 色で しめす */
function needMarks() {
  return '<span class="dots">' + NEED_ORDER.map(k => {
    const st = Engine.needState(k);
    return '<i class="' + (st === 'ask' ? 'low' : st === 'soon' ? 'warm' : 'on') + '"></i>';
  }).join('') + '</span>';
}
function treatDots() {
  const l = CONFIG.dailyLimits.treat - (state.daily.used.treat || 0);
  return '<span class="dots"><i class="' + (l > 0 ? 'on' : '') + '"></i></span>';
}

/* 思い出カード */
function memoryCard(m, big) {
  const tags = [PERSONALITIES[m.basePersonality].name].concat((m.traits || []).map(t => TRAITS[t].name));
  const titles = (m.titles || []).map(id => (TITLES.find(t => t.id === id) || {}).name).filter(Boolean);
  return '<div class="mcard" data-act="memory" data-arg="' + m.memoryId + '">' +
    '<div class="mc-h"><img src="' + charAsset(m.characterId, 'win') + '" alt="">' +
    '<div><div class="mc-n">' + esc(m.displayName) + '</div>' +
    '<div class="mc-g">第' + m.generationNo + '世代 ・ ' + fmtDate(m.records.retiredAt) + '</div>' +
    '<div class="mc-tags">' + tags.map(t => '<span class="pill g">' + esc(t) + '</span>').join('') +
    (m.firstFind ? '<span class="pill s">はつ</span>' : '') + '</div></div></div>' +
    (big && titles.length ? '<div class="mc-tags" style="margin-top:10px">' +
      titles.map(t => '<span class="pill">' + esc(t) + '</span>').join('') + '</div>' : '') +
    '</div>';
}

/* ---------- 描画 ---------- */
function render() {
  Engine.tick();
  const prevScreen = RENDERED_SCREEN;
  if (state.ui.screen !== 'SC-01' && state.ui.screen !== 'SC-DEV' && state.pending.length && state.ui.screen !== 'SC-07')
    state.ui.screen = 'SC-07';
  document.body.classList.toggle('nomotion', !!state.settings.reduceMotion);
  renderTop(); renderNav();
  $('#view').innerHTML = (SCREENS[state.ui.screen] || SCREENS['SC-02'])();
  $('#view').scrollTop = 0;
  if (state.ui.screen === 'SC-07') mountGrowth();
  if (state.ui.screen === 'SC-06') Match.mount();
  if (state.ui.screen === 'SC-11') PhotoEditor.mount();
  RENDERED_SCREEN = state.ui.screen;
  Sound.syncBgm();
  if (prevScreen !== undefined && prevScreen !== state.ui.screen) { /* 画面が かわった */ }
}
let RENDERED_SCREEN;

/* 成長演出 */
function mountGrowth() {
  if (REVEAL_TIMER) { clearInterval(REVEAL_TIMER); REVEAL_TIMER = null; }
  const p = state.pending[0]; if (!p) return;
  const img = document.getElementById('growSpr'), body = document.getElementById('growBody');
  const pool = p.kind === 'posi' ? POSI_ORDER : PLAYER_ORDER;
  const finish = () => {
    if (REVEAL_TIMER) { clearInterval(REVEAL_TIMER); REVEAL_TIMER = null; }
    img.classList.remove('shk'); img.classList.add('reveal');
    img.src = charAsset(p.to, 'win');
    Sound.grow();

/* ---------- 操作 ---------- */
const ACTIONS = {
  nav(arg) {
    if (arg === 'menu') return openMenu();
    if (state.pending.length && arg !== 'SC-07') { toast('けっかを みてね'); return; }
    if (arg !== 'SC-06') Match.reset();

    state.ui.screen = arg; closeSheet(); render();
  },
  newgame() {
    const go = () => { Storage.clear(); state = createInitialState(); state.ui.screen = 'SC-02'; Storage.save(); closeSheet(); Sound.page(); render(); };

  },
  continue() { Sound.page(); state.ui.screen = 'SC-02'; render(); },
  restore() {

      const f = i.files[0]; if (!f) return;

      r.readAsText(f);

  },
  care(arg) {
    const before = Engine.countOwned();
    const r = Engine.doCare(arg);

    Sound.pico(); render(); toast(r.msg, 'good'); announceStamps(before);
  },
  train(arg) {
    const before = Engine.countOwned();

    toast(r.genius ? 'コツを つかんだ！' : (r.tired ? 'つかれて きた…' : (r.hungry ? 'おなかが すいて のびない…' : ABILITIES[r.ab] + 'が のびた')),

  treat(arg) {

    const msg = Engine.doTreat(arg); render(); toast(msg, 'good'); announceStamps(before);
  },
  growthOk() { Sound.page(); state.pending.shift(); Storage.save(); if (!state.pending.length) state.ui.screen = 'SC-02'; render(); },
  nextgen() { state.pending = []; Engine.nextGeneration(); state.ui.screen = 'SC-02'; render(); Sound.grow(); toast('あたらしい こが きた', 'gold'); },
  dex(arg) {
    const [kind, id] = arg.split(':');
    if (!state.collection[kind][id]) return openSheet('<h3>？？？</h3><div class="panel" style="text-align:center;font-size:60px">？</div>' + sheetClose());
    const got = state.collection[kind][id], c = CHARS[id];
    openSheet('<h3>' + esc(c.name) + '</h3>' +
      stageBlock({ charId: id, face: 'happy', plate: false }) +

      '<div class="kv"><span>' + (kind === 'posi' ? 'ポジション' : '背番号') + '</span><b>' +
      (kind === 'posi' ? POSITIONS[id].label : PLAYERS[id].no) + '</b></div>' +

  },
  stamp(arg) {

  devFill(arg) {

  },
  devNeed(arg) {

  devAb(arg, el) { state.currentCreature.abilities[arg] = parseInt(el.value, 10); Storage.save(); el.parentNode.querySelector('.v').textContent = el.value; },
  devPers(arg, el) {

  devStyle(arg) {
    const c = state.currentCreature;
    if (arg === 'clear') { c.style = { combo: 0, strategy: 0 }; c.spirit = 0; }

    Storage.save(); toast('かえました');
  },
  devPosi(arg, el) {
    const id = el.value; if (!id) return;
    const c = state.currentCreature;
    c.stage = 'posi'; c.posiId = id; c.characterId = id; c.playerId = null;
    c.stageStartedAt = nowMs(); state.pending = []; state.lastRetire = null;
    Engine.discover('posi', id); Engine.checkStamps(); state.ui.stampChar = id; state.ui.photoChar = id;
    Storage.save(); render(); toast(charName(id) + 'に した');
  },
  devPlayer(arg, el) {
    const id = el.value; if (!id) return;
    const c = state.currentCreature;
    c.stage = 'player'; c.playerId = id; c.characterId = id;
    if (!c.posiId) c.posiId = PLAYERS[id].from[0];
    c.stageStartedAt = nowMs(); state.pending = []; state.lastRetire = null;
    Engine.discover('player', id); Engine.checkStamps(); state.ui.stampChar = id; state.ui.photoChar = id;
    Storage.save(); render(); toast(charName(id) + 'に した');
  },
  devStage(arg) {
    const c = state.currentCreature;
    if (arg === 'ball') {
      c.stage = 'ball'; c.characterId = 'ball'; c.posiId = null; c.playerId = null;
      c.stageStartedAt = nowMs(); state.pending = []; state.lastRetire = null;
      Engine.checkStamps();
    } else if (arg === 'retire') {
      if (c.stage !== 'player') return toast('せんしゅっちに してから');
      const mem = Engine.retire(); c.stage = 'retired'; state.lastRetire = mem.memoryId; state.pending = [];
    }
    Storage.save(); render();
  },
  devAll(arg) {
    if (arg === 'stamp') {
      const cid = state.currentCreature.characterId;
      state.stamps.owned[cid] = state.stamps.owned[cid] || {};
      STAMP_ORDER.forEach(id => { if (!state.stamps.owned[cid][id]) state.stamps.owned[cid][id] = nowMs(); });
    }
    if (arg === 'dex') { POSI_ORDER.forEach(id => Engine.discover('posi', id)); PLAYER_ORDER.forEach(id => Engine.discover('player', id)); }
    if (arg === 'gen') state.generationNo++;
    if (arg === 'clearcol') { state.collection = { posi: {}, player: {} }; state.stamps.owned = {}; state.memories = []; }
    Storage.save(); render(); toast('かえました');
  }
};
