/* ============================ 9. しあい ============================
   ゲームは3種からランダム。判定は しっぱい / せいこう / 大せいこう。
   タイミングの許容幅は 能力で ひろがる（運＋タイミング＋ステータス）。
   ------------------------------------------------------------------ */
const GRADES = {
  fail: { label: 'しっぱい', face: 'sad', gain: 1.4, style: 1, spirit: 1, mood: -6 },
  ok: { label: 'せいこう', face: 'happy', gain: 3.2, style: 4, spirit: 4, mood: 9 },
  great: { label: '大せいこう', face: 'win', gain: 5.6, style: 7, spirit: 8, mood: 18 }
};
const GAMES = {
  receive: {
    name: 'レシーブ', lead: 'サーブが くる。ちょうど いい ところで タップ。',
    stats: ['speed', 'flex'], ab: 'speed', ab2: 'flex', style: 'combo', tries: 3
  },
  attack: {
    name: 'アタック', lead: 'トスが あがる。いちばん 高い ところで タップ。',
    stats: ['jump', 'power'], ab: 'jump', ab2: 'power', style: 'combo', tries: 3
  },
  toss: {
    name: 'トス', lead: 'バーが 線に きたら、そのボタン。10本。',
    stats: ['brain', 'flex'], ab: 'brain', ab2: 'flex', style: 'strategy', tries: 10
  }
};
const LANES = [{ k: 'a', n: 'A', s: 'クイック' }, { k: 'b', n: 'B', s: 'クイック' }, { k: 'c', n: 'C', s: 'クイック' }];

const Match = {
  st: { phase: 'intro', game: null, try: 0, marks: [], raf: 0, timer: 0, token: 0, result: null, notes: null, miss: 0, perfect: 0 },

  reset() {
    Match.stop();
    Match.st = { phase: 'intro', game: null, try: 0, marks: [], raf: 0, timer: 0, token: Match.st.token + 1, result: null, notes: null, miss: 0, perfect: 0 };
  },
  stop() {
    if (Match.st.raf) cancelAnimationFrame(Match.st.raf);
    if (Match.st.timer) clearTimeout(Match.st.timer);
    Match.st.raf = 0; Match.st.timer = 0;
  },
  /* 能力による許容幅の倍率（1.0〜1.8） */
  mult() {
    const g = GAMES[Match.st.game], ab = state.currentCreature.abilities;
    const v = g.stats.reduce((a, k) => a + ab[k], 0) / g.stats.length;
    return 1 + clamp(v, 0, 100) / 100 * 0.8;
  },

  /* ---------------- 画面 ---------------- */
  screen() {
    const st = Match.st;
    if (st.phase === 'result') {
      const r = st.result, G = GRADES[r.grade];
      return '<div class="scr"><h2 class="hd"><img class="ic" src="' + getAsset('ui_match') + '" alt="">' + GAMES[r.game].name + '</h2>' +
        stageBlock({ face: G.face, big: true, plate: false, cls: 'reveal', say: r.msg }) +
        '<div class="panel"><div class="gradebig">' + G.label + '</div>' +
        Match.marksHtml(r.marks) + '</div>' +
        '<div class="spacer"></div>' + bigBtn('nav', 'SC-02', 'home', 'もどる', null, 'pri') + '</div>';
    }
    if (!Engine.canAct('match')) {
      return '<div class="scr"><h2 class="hd"><img class="ic" src="' + getAsset('ui_match') + '" alt="">しあい</h2>' +
        stageBlock({ face: 'sleep', say: rechargeText('match') + 'で できるよ' }) +
        '<div class="spacer"></div>' + bigBtn('nav', 'SC-02', 'home', 'もどる', null, 'pri') + '</div>';
    }
    if (st.phase === 'intro') {
      if (!st.game) {
        if (!state.matchGame) { state.matchGame = Object.keys(GAMES)[Math.floor(Math.random() * 3)]; Storage.save(); }
        st.game = state.matchGame;
      }
      const g = GAMES[st.game];
      return '<div class="scr"><h2 class="hd"><img class="ic" src="' + getAsset('ui_match') + '" alt="">' + g.name +
        '<span style="margin-left:auto">' + chargeRow('match') + '</span></h2>' +
        stageBlock({ face: 'angry', say: g.lead }) +
        '<div class="spacer"></div>' + bigBtn('matchGo', '', 'match', 'はじめる', null, 'pri') + '</div>';
    }
    if (st.game === 'toss') return Match.tossHtml();
    return st.game === 'receive' ? Match.receiveHtml() : Match.attackHtml();
  },
  marksHtml(marks) {
    const g = GAMES[Match.st.game || 'receive'];
    let o = '';
    for (let i = 0; i < g.tries; i++) {
      const m = marks[i];
      o += '<i class="' + (m === 2 ? 'great' : m === 1 ? 'ok' : m === 0 ? 'ng' : '') + '"></i>';
    }
    return '<div class="mgcount">' + o + '</div>';
  },
  receiveHtml() {
    const m = Match.mult(), w = clamp(16 * m, 10, 34);
    return '<div class="scr"><h2 class="hd"><img class="ic" src="' + getAsset('ui_match') + '" alt="">レシーブ</h2>' +
      stageBlock({ face: 'angry', plate: false, say: (Match.st.try + 1) + ' / 3 本目' }) +
      '<div class="spacer"></div>' +
      '<div class="panel">' + Match.marksHtml(Match.st.marks) +
      '<div class="hgauge" id="gauge">' +
      '<div class="zone" style="left:' + (64 - w) + '%;width:' + (w * 2) + '%"></div>' +
      '<div class="zone core" style="left:' + (64 - w / 2.4) + '%;width:' + (w / 1.2) + '%"></div>' +
      '<img class="ball" id="ball" src="' + getAsset('icon_ball') + '" alt=""></div>' +
      '<button class="btn pri bighit" id="hitBtn" style="margin-top:14px">レシーブ！</button>' +
      '<div class="mgmsg" id="mgMsg"></div></div></div>';
  },
  attackHtml() {
    const m = Match.mult(), h = clamp(15 * m, 9, 32);
    return '<div class="scr"><h2 class="hd"><img class="ic" src="' + getAsset('ui_match') + '" alt="">アタック</h2>' +
      stageBlock({ face: 'angry', plate: false, say: (Match.st.try + 1) + ' / 3 本目' }) +
      '<div class="spacer"></div>' +
      '<div class="panel">' + Match.marksHtml(Match.st.marks) +
      '<div class="vgauge" id="gauge">' +
      '<div class="zone" style="top:0;height:' + (h * 2) + '%"></div>' +
      '<div class="zone core" style="top:0;height:' + (h * 0.9) + '%"></div>' +
      '<div class="netline" style="bottom:34%"></div>' +
      '<img class="ball" id="ball" src="' + getAsset('icon_ball') + '" alt=""></div>' +
      '<button class="btn pri bighit" id="hitBtn" style="margin-top:14px">うつ！</button>' +
      '<div class="mgmsg" id="mgMsg"></div></div></div>';
  },
  tossHtml() {
    return '<div class="scr"><h2 class="hd"><img class="ic" src="' + getAsset('ui_match') + '" alt="">トス</h2>' +
      '<div class="spacer"></div>' +
      '<div class="panel">' + Match.marksHtml(Match.st.marks) +
      '<div class="lanes" id="lanes">' +
      LANES.map((l, i) => '<div class="lane" id="lane_' + l.k + '" style="left:' + (i * 33.333) + '%">' +
        '<div class="lname">' + l.n + '<br>' + l.s + '</div></div>').join('') +
      '<div class="judge"></div></div>' +
      '<div class="lanebtns">' +
      LANES.map(l => '<button class="btn" data-lane="' + l.k + '">' + l.n + '<small>' + l.s + '</small></button>').join('') +
      '</div><div class="mgmsg" id="mgMsg">よーい…</div></div></div>';
  },

  /* ---------------- 進行 ---------------- */
  go() {
    if (!Engine.useCharge('match')) { Sound.bad(); return toast('いまは できない'); }
    Match.st.phase = 'play'; Match.st.try = 0; Match.st.marks = []; Match.st.miss = 0; Match.st.perfect = 0;
    Storage.save();
    render();
  },
  mount() {
    const st = Match.st;
    if (st.phase !== 'play') return;
    Match.stop();
    const token = ++st.token;
    if (st.game === 'toss') Match.mountToss(token);
    else Match.mountSwing(token);
  },

  /* レシーブ／アタック共通のタイミング判定 */
  mountSwing(token) {
    const st = Match.st, ball = document.getElementById('ball'), btn = document.getElementById('hitBtn');
    const msg = document.getElementById('mgMsg');
    if (!ball || !btn) return;
    const isRec = st.game === 'receive';
    const m = Match.mult();
    const speed = isRec ? (0.62 + st.try * 0.13) : (0.72 + st.try * 0.12);   // 回を追うごとに少し速く
    const jitter = 0.86 + Math.random() * 0.3;                                 // 運の要素
    const t0 = performance.now();
    let pos = 0, done = false, over = false;
    const loop = now => {
      if (token !== st.token || done) return;
      const u = (now - t0) / 1000 * speed * jitter;
      if (isRec) {
        pos = u;                                    // 0→1 へ流れる
        ball.style.left = clamp(pos, 0, 1.08) * 100 + '%';
        if (pos > 1.06) { over = true; judge(null); return; }
      } else {
        pos = Math.sin(clamp(u, 0, 1) * Math.PI);   // 上がって落ちる
        ball.style.bottom = 'calc(' + (pos * 78) + '% + 4px)';
        if (u > 1.02) { over = true; judge(null); return; }
      }
      st.raf = requestAnimationFrame(loop);
    };
    st.raf = requestAnimationFrame(loop);

    const judge = () => {
      if (done) return; done = true; Match.stop();
      let mark = 0, text = 'とどかなかった…';
      if (!over) {
        if (isRec) {
          const d = Math.abs(pos - 0.64);
          if (d < 0.075 * m) { mark = 2; text = 'ぴたり！ かんぺきな レシーブ！'; }
          else if (d < 0.17 * m) { mark = 1; text = 'あがった！'; }
          else { mark = 0; text = 'はじいて しまった…'; }
        } else {
          if (pos > 0.93 - 0.09 * (m - 1)) { mark = 2; text = 'さいこうの 打点！ きまった！'; }
          else if (pos > 0.74 - 0.14 * (m - 1)) { mark = 1; text = 'いいコース！'; }
          else { mark = 0; text = 'ミートしなかった…'; }
        }
      }
      st.marks.push(mark);
      msg.textContent = text;
      Sound[mark === 2 ? 'great' : mark === 1 ? 'good' : 'tap']();
      st.timer = setTimeout(() => {
        st.try++;
        if (st.try >= 3) Match.finishSwing(); else render();
      }, 850);
    };
    btn.addEventListener('click', judge);
    const gz = document.getElementById('gauge');
    if (gz) gz.addEventListener('pointerdown', judge);
  },
  finishSwing() {
    const st = Match.st;
    const total = st.marks.reduce((a, b) => a + b, 0);       // 0〜6
    const grade = total >= 5 ? 'great' : (total >= 2 ? 'ok' : 'fail');
    Match.finish(grade, st.marks);
  },

  /* トス＝リズムゲーム */
  mountToss(token) {
    const st = Match.st;
    const box = document.getElementById('lanes'), msg = document.getElementById('mgMsg');
    if (!box) return;
    const H = 280, judgeY = H - 56, LEAD = 1500, SPACE = 620;
    const m = Match.mult();
    const win = 210 * m;                                     // 許容幅(ms)：能力でひろがる
    const notes = [];
    for (let i = 0; i < 10; i++) {
      const lane = LANES[Math.floor(Math.random() * 3)];
      const el = document.createElement('div');
      el.className = 'note';
      el.style.width = '27%';
      el.style.left = (LANES.indexOf(lane) * 33.333 + 3.2) + '%';
      el.style.transform = 'translateY(-40px)';
      el.textContent = lane.n;
      box.appendChild(el);
      notes.push({ lane: lane.k, t: LEAD + i * SPACE, el, state: 'idle' });
    }
    st.notes = notes; st.miss = 0; st.perfect = 0; st.marks = [];
    const t0 = performance.now();
    const loop = now => {
      if (token !== st.token) return;
      const el = now - t0;
      let alive = 0;
      notes.forEach(n => {
        if (n.state === 'idle') {
          const p = (el - n.t + LEAD) / LEAD;
          n.el.style.transform = 'translateY(' + (-40 + p * (judgeY + 40)) + 'px)';
          if (el - n.t > win) { n.state = 'miss'; n.el.classList.add('miss'); st.miss++; st.marks.push(0); flash(msg, 'ぬけた…'); }
          else alive++;
        }
      });
      if (!alive && el > LEAD + 9 * SPACE + win + 200) { Match.finishToss(); return; }
      st.raf = requestAnimationFrame(loop);
    };
    st.raf = requestAnimationFrame(loop);
    const press = k => {
      const el = performance.now() - t0;
      let best = null, bd = 1e9;
      st.notes.forEach(n => {
        if (n.state !== 'idle' || n.lane !== k) return;
        const d = Math.abs(el - n.t);
        if (d < bd) { bd = d; best = n; }
      });
      const lane = document.getElementById('lane_' + k);
      if (lane) { lane.classList.add('f'); setTimeout(() => lane.classList.remove('f'), 110); }
      if (best && bd <= win) {
        best.state = 'hit'; best.el.classList.add('hit');
        best.el.style.transform = 'translateY(' + judgeY + 'px) scale(1.12)';
        setTimeout(() => { best.el.style.opacity = '0'; }, 90);
        const perfect = bd <= win * 0.42;
        if (perfect) st.perfect++;
        st.marks.push(perfect ? 2 : 1);
        Sound[perfect ? 'great' : 'good']();
        flash(msg, perfect ? 'ぴったり！' : 'ナイス！');
      } else { Sound.tap(); }
    };
    document.querySelectorAll('[data-lane]').forEach(b => {
      b.addEventListener('pointerdown', e => { e.preventDefault(); press(b.getAttribute('data-lane')); });
    });
    function flash(node, t) { if (node) node.textContent = t; }
  },
  finishToss() {
    const st = Match.st;
    Match.stop();
    const grade = st.miss >= 3 ? 'fail' : (st.miss === 0 ? 'great' : 'ok');
    Match.finish(grade, st.marks);
  },

  /* ---------------- 結果 ---------------- */
  finish(grade, marks) {
    const st = Match.st, g = GAMES[st.game], G = GRADES[grade];
    const msgs = {
      receive: { great: 'ぜんぶ 上げきった。守りが つながる。', ok: 'よく ひろった。', fail: 'つぎは とめよう。' },
      attack: { great: 'すべて 決まった。コートが わいた。', ok: '打ち切れた。', fail: 'ブロックに つかまった。' },
      toss: { great: 'すべて 合った。速い 攻撃が つながる。', ok: 'テンポは よかった。', fail: 'リズムが つかめなかった。' }
    };
    const res = {
      game: st.game, grade, marks: marks.slice(),
      abKey: g.ab, abKey2: g.ab2, styleKey: g.style,
      msg: msgs[st.game][grade]
    };
    if (grade === 'great') Sound.great(); else if (grade === 'ok') Sound.good();
    state.matchGame = null;                       // つぎは また ランダム
    const before = Engine.countOwned();
    Engine.applyMatch(res);
    st.result = res; st.phase = 'result';
    render();
    announceStamps(before);
  }
};
ACTIONS.matchGo = () => Match.go();
/* ============================ 10. PhotoEditor ============================
   写真は端末内だけで処理する。送信も 位置情報の表示も 行わない。
   キャラ・スタンプはドット絵なので、拡大時もにじませずに描く。
   ---------------------------------------------------------------------- */
const PhotoEditor = {
  st: { img: null, bg: null, layers: [], sel: -1, W: 1000, H: 1250 },

  screen() {
    const st = PhotoEditor.st;
    /* スタンプを持っている子＝これまで育てた すがた。横スライドで切りかえる。 */
    const owners = Engine.stampChars();
    let sc = state.ui.photoChar;
    if (owners.indexOf(sc) < 0) sc = state.currentCreature.characterId;
    if (owners.indexOf(sc) < 0) sc = owners[owners.length - 1];
    const owned = sc ? Object.keys(Engine.ownedOf(sc) || {}) : [];
    const seen = {};
    const chars = [{ id: state.currentCreature.characterId, face: 'happy' }]
      .concat(state.memories.map(m => ({ id: m.characterId, face: 'win' })))
      .filter(c => { if (seen[c.id]) return false; seen[c.id] = 1; return true; }).slice(0, 10);
    return '<div class="scr">' +
      '<h2 class="hd"><img class="ic" src="' + getAsset('ui_camera') + '" alt="">おでかけ</h2>' +
      '<div class="scrollpanel" style="display:flex;flex-direction:column;gap:10px">' +
      '<div class="pstage"><canvas id="pcv" width="' + st.W + '" height="' + st.H + '"></canvas></div>' +
      '<div class="ptools">' +
      '<button class="btn" data-act="pTool" data-arg="bigger" aria-label="おおきく">＋</button>' +
      '<button class="btn" data-act="pTool" data-arg="smaller" aria-label="ちいさく">－</button>' +
      '<button class="btn" data-act="pTool" data-arg="rot" aria-label="まわす">↻</button>' +
      '<button class="btn" data-act="pTool" data-arg="front" aria-label="まえへ">⬆</button>' +
      '<button class="btn warnb" data-act="pTool" data-arg="del" aria-label="けす">✕</button>' +
      '</div>' +
      '<div class="panel"><div class="g2">' +
      bigBtn('pLoad', '', 'camera', 'しゃしん', null, 'sm pri') +
      bigBtn('pTool', 'clear', '', 'コートに もどす', null, 'sm') + '</div></div>' +
      '<div class="panel"><div class="rowlab"><b>キャラ</b><span></span></div>' +
      '<div class="picker">' + chars.map(c =>
        '<button data-act="pAddChar" data-arg="' + c.id + ':' + c.face + '" aria-label="' + esc(charName(c.id)) + '">' +
        '<img src="' + charAsset(c.id, c.face) + '" alt=""></button>').join('') + '</div></div>' +
      '<div class="panel"><div class="rowlab"><b>スタンプ</b><span>' +
      (owners.length > 1 ? '横に スライド' : '') + '</span></div>' +
      (owners.length ? charTabs(owners, sc, 'photoChar') : '') +
      '<div class="picker" id="stampPicker">' + (owned.length ? owned.map(id =>
        '<button data-act="pAddStamp" data-arg="' + sc + ':' + id + '" aria-label="' + esc(STAMP_MASTER[id].name) + '">' +
        '<img src="' + stampAsset(id, sc) + '" alt=""></button>').join('')
        : '<span class="tiny">この こは まだ もっていません</span>') + '</div></div>' +
      '<div class="panel">' + bigBtn('pSave', '', 'check', 'ほぞん・共有', null, 'pri') +
      '<p class="tiny" style="margin-top:8px">しゃしんは この端末の中だけで つかいます。</p></div>' +
      (state.album.length ? '<div class="panel"><div class="rowlab"><b>アルバム</b><span>' + state.album.length + '</span></div>' +
        '<div class="picker">' + state.album.map(a =>
          '<button data-act="pAlbum" data-arg="' + a.albumId + '"><img src="' + (a.thumb || getAsset('missing')) + '" alt=""></button>').join('') + '</div></div>' : '') +
      '</div></div>';
  },

  /* スタンプ一覧だけ 描きなおす（写真とレイヤーは そのまま） */
  redrawPicker() {
    const owners = Engine.stampChars();
    let sc = state.ui.photoChar;
    if (owners.indexOf(sc) < 0) sc = owners[owners.length - 1];
    const owned = sc ? Object.keys(Engine.ownedOf(sc) || {}) : [];
    const pk = document.getElementById('stampPicker');
    if (pk) pk.innerHTML = owned.map(id =>
      '<button data-act="pAddStamp" data-arg="' + sc + ':' + id + '" aria-label="' + esc(STAMP_MASTER[id].name) + '">' +
      '<img src="' + stampAsset(id, sc) + '" alt=""></button>').join('');
    document.querySelectorAll('.chartabs button').forEach(b => {
      b.classList.toggle('on', b.getAttribute('data-arg') === 'photoChar:' + sc);
    });
  },
  mount() {
    const st = PhotoEditor.st, cv = document.getElementById('pcv');
    if (!cv) return;
    st.cv = cv;
    try { st.ctx = cv.getContext('2d'); } catch (e) { st.ctx = null; }
    if (!st.ctx) return;
    if (!st.bg) {
      const bg = new Image();
      bg.onload = () => { st.bg = bg; PhotoEditor.draw(); };
      bg.src = getAsset('bg_gym');
    }
    PhotoEditor.draw();
    PhotoEditor.bindPointer(cv);
  },

  draw() {
    const st = PhotoEditor.st, ctx = st.ctx; if (!ctx) return;
    const W = st.cv.width, H = st.cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    const base = st.img || st.bg;
    if (base) {
      const r = Math.max(W / base.width, H / base.height);
      const w = base.width * r, h = base.height * r;
      ctx.drawImage(base, (W - w) / 2, (H - h) / 2, w, h);
    } else {
      ctx.fillStyle = '#cfe0d4'; ctx.fillRect(0, 0, W, H);
    }
    ctx.imageSmoothingEnabled = false;           // ドット絵はにじませない
    st.layers.forEach((L, i) => {
      if (!L.el || !L.el.complete) return;
      ctx.save();
      ctx.translate(L.x, L.y); ctx.rotate(L.rot); ctx.scale(L.s, L.s);
      ctx.drawImage(L.el, -L.w / 2, -L.h / 2, L.w, L.h);
      ctx.restore();
      if (i === st.sel) {
        ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.rot);
        ctx.strokeStyle = '#0f7a4f'; ctx.lineWidth = 5; ctx.setLineDash([16, 12]);
        ctx.strokeRect(-L.w * L.s / 2, -L.h * L.s / 2, L.w * L.s, L.h * L.s);
        ctx.restore();
      }
    });
    ctx.imageSmoothingEnabled = true;
  },

  addLayer(src, w, h) {
    const st = PhotoEditor.st, el = new Image();
    el.onload = () => PhotoEditor.draw();
    el.src = src;
    st.layers.push({ el, x: st.cv ? st.cv.width / 2 : 500, y: st.cv ? st.cv.height * 0.6 : 700, s: 1, rot: 0, w, h, src });
    st.sel = st.layers.length - 1;
    PhotoEditor.draw();
  },
  tool(arg) {
    const st = PhotoEditor.st, L = st.layers[st.sel];
    if (arg === 'clear') { st.img = null; PhotoEditor.draw(); return; }
    if (!L) return toast('えらんでから');
    if (arg === 'bigger') L.s = clamp(L.s * 1.2, 0.2, 4);
    if (arg === 'smaller') L.s = clamp(L.s / 1.2, 0.2, 4);
    if (arg === 'rot') L.rot += Math.PI / 12;
    if (arg === 'front') { st.layers.splice(st.sel, 1); st.layers.push(L); st.sel = st.layers.length - 1; }
    if (arg === 'del') { st.layers.splice(st.sel, 1); st.sel = st.layers.length - 1; }
    PhotoEditor.draw();
  },

  bindPointer(cv) {
    const st = PhotoEditor.st, pts = new Map();
    let base = null;
    const toCv = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
    const pick = p => {
      for (let i = st.layers.length - 1; i >= 0; i--) {
        const L = st.layers[i], hw = L.w * L.s / 2, hh = L.h * L.s / 2;
        const dx = p.x - L.x, dy = p.y - L.y, c = Math.cos(-L.rot), s = Math.sin(-L.rot);
        if (Math.abs(dx * c - dy * s) <= hw && Math.abs(dx * s + dy * c) <= hh) return i;
      }
      return -1;
    };
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId);
      const p = toCv(e); pts.set(e.pointerId, p);
      if (pts.size === 1) {
        const i = pick(p);
        if (i >= 0) { st.sel = i; st.drag = { dx: p.x - st.layers[i].x, dy: p.y - st.layers[i].y }; }
        else { st.sel = -1; st.drag = null; }
        PhotoEditor.draw();
      } else if (pts.size === 2 && st.sel >= 0) {
        const a = Array.from(pts.values());
        base = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), ang: Math.atan2(a[1].y - a[0].y, a[1].x - a[0].x), s: st.layers[st.sel].s, rot: st.layers[st.sel].rot };
      }
    });
    cv.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const p = toCv(e); pts.set(e.pointerId, p);
      const L = st.layers[st.sel]; if (!L) return;
      if (pts.size >= 2 && base) {
        const a = Array.from(pts.values());
        const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        const ang = Math.atan2(a[1].y - a[0].y, a[1].x - a[0].x);
        L.s = clamp(base.s * (d / base.d), 0.2, 4);
        L.rot = base.rot + (ang - base.ang);
      } else if (st.drag) { L.x = p.x - st.drag.dx; L.y = p.y - st.drag.dy; }
      PhotoEditor.draw();
    });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) base = null; if (!pts.size) st.drag = null; };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  },

  load() {
    const inp = document.getElementById('photoInput');
    inp.value = '';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const url = URL.createObjectURL(f), img = new Image();
      img.onload = () => {
        const st = PhotoEditor.st;
        st.img = img;
        st.cv.width = 1000;
        st.cv.height = Math.round(clamp(1000 * (img.height / img.width), 700, 1400));
        st.W = st.cv.width; st.H = st.cv.height;
        PhotoEditor.draw();
        URL.revokeObjectURL(url);
      };
      img.onerror = () => toast('よみこめません', 'bad');
      img.src = url;
    };
    inp.click();
  },

  save() {
    const st = PhotoEditor.st; if (!st.cv || !st.ctx) return;
    const out = document.getElementById('photoCanvas');
    out.width = st.cv.width; out.height = st.cv.height;
    const ctx = out.getContext('2d');
    const keep = st.sel; st.sel = -1; PhotoEditor.draw();
    ctx.drawImage(st.cv, 0, 0);
    st.sel = keep; PhotoEditor.draw();
    const W = out.width, H = out.height;
    ctx.strokeStyle = '#0f7a4f'; ctx.lineWidth = 22; ctx.strokeRect(11, 11, W - 22, H - 22);
    ctx.fillStyle = 'rgba(15,122,79,.92)'; ctx.fillRect(11, H - 92, W - 22, 81);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = 'bold 34px sans-serif';
    ctx.fillText('さんがいあっち', 34, H - 40);
    ctx.textAlign = 'right'; ctx.font = '28px sans-serif';
    ctx.fillText(fmtDate(nowMs()), W - 34, H - 40);

    const done = blob => {
      const file = new File([blob], 'sangaiatch_' + Date.now() + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => { });
      else {
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }
      PhotoEditor.record(out);
      toast('ほぞんしました', 'good');
    };
    if (out.toBlob) out.toBlob(done, 'image/png'); else toast('ほぞんできません', 'bad');
  },

  record(canvas) {
    const st = PhotoEditor.st;
    let thumb = '';
    try {
      const t = document.createElement('canvas');
      const s = CONFIG.thumbSize / Math.max(canvas.width, canvas.height);
      t.width = Math.round(canvas.width * s); t.height = Math.round(canvas.height * s);
      t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
      thumb = t.toDataURL('image/jpeg', 0.6);
    } catch (e) { }
    const before = Engine.countOwned();
    state.album.unshift({
      albumId: uid('alb'), createdAt: nowMs(),
      characterId: state.currentCreature.characterId,
      usedStampIds: st.layers.filter(l => l.stampId).map(l => l.stampChar + ':' + l.stampId), thumb
    });
    if (state.album.length > CONFIG.albumMax) state.album.length = CONFIG.albumMax;
    state.currentCreature.records.photos++;
    Engine.checkStamps();
    Storage.save();
    announceStamps(before);
    render();
  }
};
ACTIONS.pLoad = () => PhotoEditor.load();
ACTIONS.pTool = arg => PhotoEditor.tool(arg);
ACTIONS.pSave = () => PhotoEditor.save();
ACTIONS.pAddChar = arg => { const [id, face] = arg.split(':'); PhotoEditor.addLayer(charAsset(id, face), 330, 360); };
ACTIONS.pAddStamp = arg => {
  const v = arg.split(':'), cid = v.length > 1 ? v[0] : state.currentCreature.characterId, id = v[v.length - 1];
  PhotoEditor.addLayer(stampAsset(id, cid), 420, 300);
  const L = PhotoEditor.st.layers[PhotoEditor.st.layers.length - 1];
  L.stampId = id; L.stampChar = cid;
};
ACTIONS.pAlbum = arg => {
  const a = state.album.find(x => x.albumId === arg); if (!a) return;
  openSheet('<h3>' + fmtDateTime(a.createdAt) + '</h3>' +
    (a.thumb ? '<div class="panel" style="display:grid;place-items:center"><img src="' + a.thumb + '" style="max-width:100%;border-radius:12px" alt=""></div>' : '') +
    sheetClose());
};
/* ============================ 15. 起動とイベント ============================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;   // change で処理
  const act = el.getAttribute('data-act');
  const arg = el.getAttribute('data-arg') || '';
  if (ACTIONS[act]) {
    e.preventDefault();
    Sound.unlock();                       // 最初のタップで 音を つかえるようにする
    if (act !== 'nav' && act !== 'menuGo' && act !== 'care' && act !== 'train' &&
        act !== 'treat' && act !== 'growthOk' && act !== 'continue') Sound.tap();
    ACTIONS[act](arg, el);
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'SELECT')) return;
  const act = el.getAttribute('data-act');
  if (ACTIONS[act]) ACTIONS[act](el.getAttribute('data-arg') || '', el);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.type !== 'range') return;
  const act = el.getAttribute('data-act');
  if (ACTIONS[act]) ACTIONS[act](el.getAttribute('data-arg') || '', el);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* 残り時間の表示更新と、離席中に進んだ時間の取り込み */
setInterval(() => {
  if (!state) return;
  const before = state.pending.length + '|' + state.currentCreature.stage + '|' + state.daily.dayKey;
  Engine.tick();
  const after = state.pending.length + '|' + state.currentCreature.stage + '|' + state.daily.dayKey;
  if (before !== after) render(); else renderTop();
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (!state) return;
  if (document.visibilityState === 'visible') render();
  else Sound.stopAll();                   // 画面を はなれたら 音楽を 止める
});
window.addEventListener('pagehide', () => Sound.stopAll());

/* 起動 */
(function boot() {
  const loaded = Storage.load();
  state = loaded || createInitialState();
  state.ui = state.ui || {};
  state.ui.screen = 'SC-01';
  Engine.tick();
  render();
  if (loaded && state.pending.length) toast('へんかが あったよ', 'gold');
})();
</script>
